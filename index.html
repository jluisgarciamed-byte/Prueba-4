<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tablero de participación · PMDUOET 2050 · IMPLAN San Francisco del Rincón</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   TABLERO INTERNO DE PARTICIPACIÓN CIUDADANA — PMDUOET 2050
   IMPLAN San Francisco del Rincón, Guanajuato

   SOLO LECTURA. Este archivo no escribe nada en la base de datos: no hay un
   solo POST, PATCH ni DELETE en todo el código. Lee, cruza, mapea y exporta.

   Continuidad visual con el geoportal: verde = agenda ambiental, ámbar =
   agenda territorial, rampa YlOrRd para coropletas. Los códigos de problema
   y las cifras van en monoespaciada porque son el material primario del
   instrumento, no adorno.
   ============================================================================ */

:root{
  /* Paleta tomada tal cual del geoportal: verde institucional #0F3B38 sobre
     fondo #0B2A27, acento #34d399, y los mismos verde/ámbar de las agendas. */
  --fondo:#0B2A27;
  --panel:#0F3B38;
  --panel-2:#14403C;
  --panel-3:#1A5C56;
  --linea:#1A5C56;
  --linea-suave:rgba(255,255,255,.09);
  --texto:#FFFFFF;
  --texto-medio:#D1D5DB;
  --texto-tenue:#8FAAA6;
  --ambiental:#10b981;
  --territorial:#f59e0b;
  --acento:#34d399;
  --acento-hueco:rgba(52,211,153,.14);
  --alerta:#ef4444;
  --ok:#34d399;
  --sombra:0 10px 30px rgba(0,0,0,.45);
  --radio:8px;
  --mono:'Monaco','Consolas','Courier New',monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Rajdhani',system-ui,sans-serif;
  --rail-izq:298px;
  --rail-der:326px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--fondo);color:var(--texto);
  font-family:var(--sans);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#1A5C56;border-radius:9px;}
::-webkit-scrollbar-thumb:hover{background:#237a72;}

/* ---------- Estructura ---------- */
.app{
  display:grid;
  grid-template-columns:var(--rail-izq) minmax(0,1fr) var(--rail-der);
  grid-template-rows:auto minmax(0,1fr);
  height:100vh;
}
.barra{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px 16px;
  background:linear-gradient(180deg,#14403C,#0F3B38);border-bottom:1px solid var(--linea);}
.marca{display:flex;flex-direction:column;gap:1px;min-width:0;}
.marca b{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.6px;
  white-space:nowrap;text-transform:uppercase;line-height:1.05;}
.marca span{font-size:10.5px;color:var(--texto-tenue);font-family:var(--mono);letter-spacing:.3px;
  text-transform:uppercase;white-space:nowrap;}
.kpis{display:flex;gap:6px;flex:1;overflow-x:auto;padding-bottom:2px;}
.kpi{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);
  padding:6px 11px;min-width:96px;flex:0 0 auto;}
.kpi .v{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.1;letter-spacing:.3px;}
.kpi .k{font-size:9.5px;color:var(--texto-tenue);text-transform:uppercase;letter-spacing:.5px;
  white-space:nowrap;}
.kpi.amb .v{color:var(--ambiental);} .kpi.ter .v{color:var(--territorial);}
.kpi.ac .v{color:var(--acento);}
.acciones{display:flex;gap:6px;flex:0 0 auto;}

.btn{background:var(--panel-2);border:1px solid var(--linea);color:var(--texto-medio);
  border-radius:6px;padding:6px 11px;font-size:12px;font-weight:500;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s;}
.btn:hover{background:var(--panel-3);color:var(--texto);border-color:#2b7d74;}
.btn.pri{background:var(--acento);border-color:var(--acento);color:#06251F;font-weight:600;}
.btn.pri:hover{background:#5fe3b5;border-color:#5fe3b5;}
.btn.chico{padding:4px 8px;font-size:11px;}
.btn[aria-pressed="true"]{background:var(--acento-hueco);border-color:var(--acento);color:var(--acento);}

/* ---------- Rieles ---------- */
.riel{background:var(--panel);border-right:1px solid var(--linea);
  display:flex;flex-direction:column;min-height:0;}
.riel.der{border-right:none;border-left:1px solid var(--linea);}
.riel-cab{padding:9px 13px;border-bottom:1px solid var(--linea);display:flex;
  align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;}
.riel-cab h2{margin:0;font-family:var(--display);font-size:14px;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--texto-medio);font-weight:700;}
.riel-cuerpo{overflow-y:auto;padding:11px 13px 26px;flex:1;min-height:0;}

/* ---------- Filtros ---------- */
.f-grupo{border-bottom:1px solid var(--linea-suave);padding-bottom:8px;margin-bottom:8px;}
.f-grupo:last-child{border-bottom:none;}
.f-cab{display:flex;align-items:center;justify-content:space-between;width:100%;
  background:none;border:none;padding:5px 0;text-align:left;color:var(--texto-medio);
  font-size:11.5px;font-weight:600;letter-spacing:.2px;}
.f-cab:hover{color:var(--texto);}
.f-cab .cuenta{font-family:var(--mono);font-size:10px;color:var(--acento);}
.f-cab .flecha{transition:transform .15s;font-size:9px;color:var(--texto-tenue);}
.f-grupo.abierto .f-cab .flecha{transform:rotate(90deg);}
.f-lista{display:none;max-height:210px;overflow-y:auto;margin-top:4px;padding-right:3px;}
.f-grupo.abierto .f-lista{display:block;}
.f-op{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:4px;cursor:pointer;
  font-size:12px;color:var(--texto-medio);line-height:1.35;}
.f-op:hover{background:var(--panel-2);color:var(--texto);}
.f-op input{accent-color:var(--acento);margin:0;flex:0 0 auto;width:13px;height:13px;}
.f-op .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--texto-tenue);
  flex:0 0 auto;}
.f-op .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.f-rango{display:flex;gap:6px;align-items:center;margin-top:5px;}
.f-rango input{background:var(--fondo);border:1px solid var(--linea);border-radius:5px;
  padding:5px 7px;width:100%;font-family:var(--mono);font-size:11.5px;}
.f-buscar{width:100%;background:var(--fondo);border:1px solid var(--linea);border-radius:5px;
  padding:5px 8px;font-size:11.5px;margin-bottom:5px;}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 13px 9px;}
.chip{background:var(--acento-hueco);border:1px solid #2b7d74;color:var(--acento);border-radius:20px;
  padding:2px 7px 2px 9px;font-size:10.5px;display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);}
.chip button{background:none;border:none;color:inherit;padding:0;font-size:13px;line-height:1;
  opacity:.65;}
.chip button:hover{opacity:1;}

/* ---------- Centro ---------- */
.centro{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--fondo);}
.mapa-caja{position:relative;flex:0 0 var(--alto-mapa,54%);min-height:230px;
  border-bottom:1px solid var(--linea);}
#mapa{position:absolute;inset:0;background:#08201E;}
.leaflet-container{font-family:var(--sans);background:#08201E;}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--texto);border-radius:7px;
  box-shadow:var(--sombra);border:1px solid var(--linea);}
.leaflet-popup-tip{background:var(--panel);border:1px solid var(--linea);}
.leaflet-popup-content{margin:11px 13px;font-size:12px;line-height:1.5;}
.leaflet-popup-close-button{color:var(--texto-tenue)!important;}
.leaflet-bar a{background:var(--panel);color:var(--texto-medio);border-color:var(--linea);}
.leaflet-bar a:hover{background:var(--panel-2);color:var(--texto);}
.leaflet-control-attribution{background:rgba(11,42,39,.82)!important;color:var(--texto-tenue)!important;
  font-size:9.5px!important;}
.leaflet-control-attribution a{color:var(--texto-medio)!important;}
.leaflet-control-scale-line{background:rgba(11,42,39,.75);border-color:var(--linea);color:var(--texto-medio);}

.mapa-barra{position:absolute;top:9px;left:9px;z-index:520;display:flex;gap:5px;flex-wrap:wrap;
  max-width:calc(100% - 120px);}
.mapa-barra .btn{background:rgba(15,59,56,.94);backdrop-filter:blur(6px);box-shadow:var(--sombra);}
.mapa-der{position:absolute;top:9px;right:9px;z-index:520;display:flex;flex-direction:column;gap:5px;
  align-items:flex-end;}
.mapa-der .btn{background:rgba(15,59,56,.94);backdrop-filter:blur(6px);box-shadow:var(--sombra);}
.leyenda{position:absolute;bottom:22px;left:9px;z-index:520;background:rgba(15,59,56,.95);
  backdrop-filter:blur(6px);border:1px solid var(--linea);border-radius:var(--radio);
  padding:8px 11px;font-size:11px;box-shadow:var(--sombra);max-width:230px;}
.leyenda h4{margin:0 0 5px;font-size:10px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--texto-tenue);font-weight:600;}
.ley-fila{display:flex;align-items:center;gap:6px;margin:2px 0;color:var(--texto-medio);}
.ley-caja{width:13px;height:11px;border-radius:2px;flex:0 0 auto;border:1px solid rgba(255,255,255,.14);}
.marcador{border-radius:50%;border:1.6px solid rgba(255,255,255,.85);
  box-shadow:0 0 0 1px rgba(0,0,0,.5);}
.sel-activa{position:absolute;bottom:22px;right:9px;z-index:520;background:var(--acento-hueco);
  border:1px solid var(--acento);color:var(--acento);border-radius:var(--radio);padding:6px 10px;
  font-size:11px;font-family:var(--mono);display:none;align-items:center;gap:8px;}
.sel-activa.visible{display:flex;}

/* ---------- Pestañas y paneles ---------- */
.tabs{display:flex;gap:2px;padding:0 11px;border-bottom:1px solid var(--linea);
  background:var(--panel);flex:0 0 auto;overflow-x:auto;}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 13px;
  color:var(--texto-tenue);font-family:var(--display);font-size:14px;font-weight:600;
  letter-spacing:.5px;white-space:nowrap;}
.tab:hover{color:var(--texto-medio);}
.tab.activa{color:var(--acento);border-bottom-color:var(--acento);}
.paneles{flex:1;overflow-y:auto;min-height:0;padding:13px;}
.panel{display:none;} .panel.activo{display:block;}

.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);
  padding:11px 13px 13px;min-width:0;}
.tarjeta.ancha{grid-column:1/-1;}
.tarjeta h3{margin:0 0 2px;font-family:var(--display);font-size:15.5px;font-weight:700;
  letter-spacing:.5px;line-height:1.2;}
.tarjeta .sub{margin:0 0 9px;font-size:10.5px;color:var(--texto-tenue);line-height:1.4;}
.tarjeta-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;}
.lienzo{position:relative;height:250px;}
.lienzo.alto{height:330px;} .lienzo.bajo{height:190px;}

/* ---------- Tablas ---------- */
.tabla-env{overflow:auto;max-height:520px;border:1px solid var(--linea);border-radius:6px;}
table.datos{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px;}
table.datos th,table.datos td{padding:5px 9px;text-align:left;border-bottom:1px solid var(--linea-suave);
  white-space:nowrap;}
table.datos thead th{position:sticky;top:0;background:var(--panel-2);z-index:3;
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--texto-tenue);
  font-weight:600;border-bottom:1px solid var(--linea);}
table.datos tbody tr:hover td{background:rgba(52,211,153,.07);}
table.datos td.num,table.datos th.num{text-align:right;font-family:var(--mono);font-size:11px;}
table.datos td.eje{position:sticky;left:0;background:var(--panel);z-index:2;font-weight:500;
  border-right:1px solid var(--linea);max-width:230px;overflow:hidden;text-overflow:ellipsis;}
table.datos thead th.eje{z-index:4;background:var(--panel-2);}
table.datos tfoot td{position:sticky;bottom:0;background:var(--panel-2);font-family:var(--mono);
  font-weight:600;border-top:1px solid var(--linea);}
.celda{position:relative;}
.celda span{position:relative;z-index:1;}
.cero{color:var(--texto-tenue);opacity:.4;}

/* ---------- Riel derecho ---------- */
.top-fila{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px;cursor:pointer;
  border-radius:4px;}
.top-fila:hover{background:var(--panel-2);}
.top-fila .pos{font-family:var(--mono);font-size:10px;color:var(--texto-tenue);width:17px;flex:0 0 auto;}
.top-fila .cuerpo{flex:1;min-width:0;}
.top-fila .et{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--texto-medio);}
.top-fila:hover .et{color:var(--texto);}
.top-fila .barra-mini{height:3px;border-radius:3px;margin-top:3px;background:var(--acento);
  min-width:2px;}
.top-fila .n{font-family:var(--mono);font-size:11px;color:var(--texto);flex:0 0 auto;}
.mini-h{font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:1px;
  color:var(--texto-medio);font-weight:700;margin:14px 0 5px;padding-top:10px;
  border-top:1px solid var(--linea-suave);}
.mini-h:first-child{margin-top:0;padding-top:0;border-top:none;}
.dato-fila{display:flex;justify-content:space-between;gap:9px;padding:3px 0;font-size:11.5px;
  color:var(--texto-medio);border-bottom:1px solid var(--linea-suave);}
.dato-fila b{font-family:var(--mono);font-weight:500;color:var(--texto);}
.dato-fila.mal b{color:var(--alerta);}
.dato-fila.bien b{color:var(--ok);}

/* ---------- Utilidades ---------- */
.selec{background:var(--fondo);border:1px solid var(--linea);border-radius:5px;padding:5px 8px;
  font-size:11.5px;max-width:100%;}
.fila{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.cod{font-family:var(--mono);font-size:10.5px;color:var(--texto-tenue);}
.pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;font-family:var(--mono);}
.pill.amb{background:rgba(16,185,129,.2);color:#6ee7b7;}
.pill.ter{background:rgba(245,158,11,.2);color:var(--territorial);}
.vacio{padding:26px 14px;text-align:center;color:var(--texto-tenue);font-size:12px;line-height:1.6;}
.nota{font-size:10.5px;color:var(--texto-tenue);line-height:1.55;margin-top:9px;
  padding-top:9px;border-top:1px solid var(--linea-suave);}
.cargando{position:fixed;inset:0;background:rgba(11,42,39,.95);z-index:9000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.cargando.oculto{display:none;}
.giro{width:34px;height:34px;border:3px solid var(--linea);border-top-color:var(--acento);
  border-radius:50%;animation:girar .8s linear infinite;}
@keyframes girar{to{transform:rotate(360deg);}}
.cargando p{color:var(--texto-medio);font-size:13px;margin:0;font-family:var(--display);letter-spacing:.5px;}
.aviso{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.38);color:#fca5a5;
  border-radius:6px;padding:9px 12px;font-size:11.5px;margin-bottom:11px;line-height:1.5;}
.aviso.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.32);color:#6ee7b7;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--panel-2);border:1px solid var(--linea);border-radius:7px;padding:10px 16px;
  font-size:12px;box-shadow:var(--sombra);z-index:9500;opacity:0;transition:.25s;pointer-events:none;}
.toast.visible{transform:translateX(-50%) translateY(0);opacity:1;}
.abrir-riel{display:none;}

/* ---------- Consulta por folio ---------- */
.folio-caja{position:relative;flex:0 0 auto;}
.folio-input{background:var(--fondo);border:1px solid var(--linea);border-radius:6px;
  padding:6px 10px;width:146px;font-family:var(--mono);font-size:11.5px;letter-spacing:.4px;
  transition:width .18s,border-color .12s;}
.folio-input:focus{width:196px;border-color:var(--acento);outline:none;}
.folio-input::placeholder{font-family:var(--sans);letter-spacing:0;color:var(--texto-tenue);}
.folio-resultados{position:absolute;top:calc(100% + 5px);right:0;min-width:290px;max-height:322px;
  overflow-y:auto;background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);z-index:2000;display:none;padding:4px;}
.folio-resultados.visible{display:block;}
.folio-res{display:block;width:100%;text-align:left;background:none;border:none;border-radius:5px;
  padding:6px 9px;color:var(--texto-medio);font-size:11.5px;line-height:1.4;}
.folio-res:hover,.folio-res:focus{background:var(--panel-2);color:var(--texto);}
.folio-res b{font-family:var(--mono);color:var(--acento);font-weight:500;}
.folio-res span{display:block;font-size:10.5px;color:var(--texto-tenue);}

.modal{position:fixed;inset:0;background:rgba(6,20,18,.78);backdrop-filter:blur(3px);z-index:8000;
  display:none;align-items:center;justify-content:center;padding:24px;}
.modal.visible{display:flex;}
.modal-caja{background:var(--panel);border:1px solid var(--linea);border-radius:12px;
  box-shadow:var(--sombra);width:min(920px,100%);max-height:88vh;display:flex;flex-direction:column;}
.modal-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:14px 18px;border-bottom:1px solid var(--linea);flex:0 0 auto;}
.modal-cab h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.8px;}
.modal-cab .sub{margin:2px 0 0;font-size:11px;color:var(--texto-tenue);}
.modal-cuerpo{overflow-y:auto;padding:16px 18px 22px;}
.perfil-rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:8px;
  margin-bottom:14px;}
.perfil-dato{background:var(--panel-2);border:1px solid var(--linea);border-radius:6px;padding:7px 10px;}
.perfil-dato .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--texto-tenue);}
.perfil-dato .v{font-size:12.5px;line-height:1.35;margin-top:1px;}
.prob-fila{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:5px;
  border-left:2px solid var(--linea);margin-bottom:3px;font-size:12px;line-height:1.4;}
.prob-fila.amb{border-left-color:var(--ambiental);}
.prob-fila.ter{border-left-color:var(--territorial);}
.prob-fila.grave{background:var(--acento-hueco);}
.prob-orden{font-family:var(--display);font-size:14px;font-weight:700;color:var(--acento);
  min-width:20px;flex:0 0 auto;}
.prob-fila .cod{display:block;margin-top:1px;}

/* ---------- Espacios institucionales ---------- */
.logo-slot{display:flex;align-items:center;justify-content:center;flex:0 0 auto;height:40px;}
.logo-slot:empty{display:none;}
.logo-slot img{max-height:40px;max-width:150px;object-fit:contain;display:block;}
.logo-hueco{border:1px dashed var(--linea);border-radius:6px;height:40px;min-width:74px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--texto-tenue);text-align:center;line-height:1.3;}

/* ---- Lectura paginada. PostgREST corta en 1,000 filas sin avisar; con el
        header Range se recorre la tabla completa. ---- */
async function leer(ruta, orden) {
  const TAM = 1000, TOPE = 60000;
  const sep = ruta.includes('?') ? '&' : '?';
  const url = `${SUPABASE_URL}/rest/v1/${ruta}${orden ? `${sep}order=${orden}` : ''}`;
  const filas = []; let inicio = 0;
  while (true) {
    const r = await fetch(url, { headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      'Range-Unit': 'items', Range: `${inicio}-${inicio + TAM - 1}`, Prefer: 'count=exact' } });
    if (!r.ok) throw new Error(`HTTP ${r.status} en ${ruta} — ${(await r.text().catch(()=>'')).slice(0,160)}`);
    const pagina = await r.json();
    filas.push(...pagina);
    let total = null;
    const cr = r.headers.get('content-range');
    if (cr && cr.includes('/')) { const t = parseInt(cr.split('/')[1], 10); if (!isNaN(t)) total = t; }
    if (pagina.length < TAM) break;
    if (total !== null && filas.length >= total) break;
    if (filas.length >= TOPE) break;
    inicio += TAM;
  }
  return filas;
}

/* ---- Geometría: WKT/EWKT o GeoJSON -> GeoJSON ---- */
function aGeoJSON(g) {
  if (!g) return null;
  if (typeof g === 'object') return g;
  if (typeof g !== 'string') return null;
  try { const j = JSON.parse(g); if (j && j.type && j.coordinates) return j; } catch (e) {}
  try {
    const s = g.trim().replace(/^SRID=\d+;\s*/i, '');
    const U = s.toUpperCase();
    const lista = t => t.trim().split(',').map(p => { const n = p.trim().split(/\s+/).map(Number); return [n[0], n[1]]; });
    const partir = t => { const r = []; let d = 0, ini = 0;
      for (let i = 0; i < t.length; i++) { const c = t[i];
        if (c === '(') d++; else if (c === ')') d--;
        else if (c === ',' && d === 0) { r.push(t.slice(ini, i)); ini = i + 1; } }
      r.push(t.slice(ini)); return r.map(x => x.trim()); };
    const dentro = t => t.slice(t.indexOf('(') + 1, t.lastIndexOf(')'));
    if (U.startsWith('POINT')) { const n = dentro(s).trim().split(/\s+/).map(Number);
      return isNaN(n[0]) ? null : { type:'Point', coordinates:[n[0], n[1]] }; }
    if (U.startsWith('MULTIPOINT')) return { type:'MultiPoint', coordinates: lista(dentro(s).replace(/[()]/g,'')) };
    if (U.startsWith('MULTILINESTRING')) return { type:'MultiLineString', coordinates: partir(dentro(s)).map(l => lista(dentro(l))) };
    if (U.startsWith('LINESTRING')) return { type:'LineString', coordinates: lista(dentro(s)) };
    if (U.startsWith('MULTIPOLYGON')) return { type:'MultiPolygon', coordinates: partir(dentro(s)).map(p => partir(dentro(p)).map(r => lista(dentro(r)))) };
    if (U.startsWith('POLYGON')) return { type:'Polygon', coordinates: partir(dentro(s)).map(r => lista(dentro(r))) };
  } catch (e) {}
  return null;
}
function aWKT(g) {
  if (!g || !g.type) return '';
  const par = c => c.map(p => `${p[0]} ${p[1]}`).join(', ');
  const anillos = a => a.map(r => `(${par(r)})`).join(', ');
  switch (g.type) {
    case 'Point': return `POINT(${g.coordinates[0]} ${g.coordinates[1]})`;
    case 'MultiPoint': return `MULTIPOINT(${par(g.coordinates)})`;
    case 'LineString': return `LINESTRING(${par(g.coordinates)})`;
    case 'MultiLineString': return `MULTILINESTRING(${g.coordinates.map(l => `(${par(l)})`).join(', ')})`;
    case 'Polygon': return `POLYGON(${anillos(g.coordinates)})`;
    case 'MultiPolygon': return `MULTIPOLYGON(${g.coordinates.map(p => `(${anillos(p)})`).join(', ')})`;
    default: return '';
  }
}
function tipoAlcance(geom, alcance) {
  if (alcance) return alcance;
  const t = (geom && geom.type || '').toLowerCase();
  if (t.includes('polygon')) return 'poligono';
  if (t.includes('linestring')) return 'linea';
  return 'punto';
}
function centro(geom, lat, lng) {
  if (lat != null && lng != null && !isNaN(lat) && !isNaN(lng)) return [Number(lat), Number(lng)];
  if (!geom) return null;
  try { const c = turf.center({ type:'Feature', geometry:geom, properties:{} }).geometry.coordinates;
    return [c[1], c[0]]; } catch (e) { return null; }
}

/* ---- Carga completa ---- */
async function cargarTodo() {
  estado.avisos = [];
  cargando('Leyendo participaciones…');
  const participaciones = await leer('participacion_pmduoet?select=*', 'id.asc');

  cargando('Leyendo problemas georreferenciados…');
  let problemas = [];
  try { problemas = await leer('problemas_pmduoet?select=*', 'id.asc'); }
  catch (e) {
    estado.avisos.push('No se pudo leer <b>problemas_pmduoet</b>. Los problemas se reconstruyeron desde la tabla de participaciones, con la ubicación general de cada cuestionario.');
  }

  cargando('Leyendo padrón de colonias y localidades…');
  const [cols, locs] = await Promise.all([
    leer('Colonias_SFR?select=nomcolonia,geom').catch(() => []),
    leer('Localidades%201?select=nom_loc,geom').catch(() => [])
  ]);

  /* Fecha: el formulario no la manda, la pone la base. Se detecta la columna. */
  const muestra = participaciones[0] || {};
  estado.campoFecha = ['fecha_creacion','created_at','fecha','inserted_at','creado_en']
    .find(c => c in muestra) || null;

  /* Madres indexadas */
  const porId = new Map();
  participaciones.forEach(p => {
    p._prioridades = leerPrioridades(p);
    p._ubicaciones = leerUbicaciones(p);
    p._fecha = estado.campoFecha ? new Date(p[estado.campoFecha]) : null;
    p._geom = aGeoJSON(p.geom);
    p._centro = centro(p._geom, p.lat, p.lng);
    porId.set(p.id, p);
  });

  /* Unión hija-madre: aquí es donde el tablero gana su poder analítico.
     Cada problema hereda el perfil completo de quien lo reportó. */
  let filas = [];
  if (problemas.length > 0) {
    filas = problemas.map(h => {
      const m = porId.get(h.participacion_id) || {};
      const geom = aGeoJSON(h.geom);
      return armarFila(h.codigo_problema, m, {
        geom, lat: h.lat, lng: h.lng,
        alcance: h.alcance, orden: h.orden_prioridad,
        texto: h.texto_problema, idHijo: h.id
      });
    });
  } else {
    estado.reconstruido = true;
    participaciones.forEach(p => {
      const codigos = Array.isArray(p.respuestas) ? p.respuestas : [];
      const otros = p.otros && typeof p.otros === 'object' ? Object.keys(p.otros).filter(k => !k.startsWith('_')) : [];
      [...codigos, ...otros].forEach(cod => {
        const u = (p._ubicaciones || {})[cod];
        const geom = u ? aGeoJSON(u.geojson || u.geom) : p._geom;
        filas.push(armarFila(cod, p, {
          geom, lat: u ? u.lat : p.lat, lng: u ? u.lng : p.lng,
          alcance: u ? u.tipo : null,
          orden: (p._prioridades[cod] || null),
          texto: (p.otros || {})[cod] || null, idHijo: null
        }));
      });
    });
    if (participaciones.length > 0 && filas.length > 0) {
      estado.avisos.push('Los problemas se reconstruyeron desde <code>respuestas</code>. Para tener una geometría por problema, ejecute la migración SQL de <b>problemas_pmduoet</b>.');
    }
  }

  estado.participaciones = participaciones;
  estado.problemas = filas;
  estado.colonias = cols.map(c => ({ nombre: c.nomcolonia, geometry: aGeoJSON(c.geom) }))
                        .filter(c => c.nombre);
  estado.localidades = locs.map(l => ({ nombre: l.nom_loc, geometry: aGeoJSON(l.geom) }))
                           .filter(l => l.nombre);
  estado.nombresColonia = new Set(estado.colonias.map(c => norm(c.nombre)));
  estado.nombresLocalidad = new Set(estado.localidades.map(l => norm(l.nombre)));

  /* El asentamiento se clasifica contra el padrón: colonia = urbano,
     localidad = rural. Es el corte que exige el enfoque diferenciado. */
  estado.problemas.forEach(f => {
    const n = norm(f.colonia);
    f.asentamiento = estado.nombresColonia.has(n) ? 'Colonia (urbano)'
                   : estado.nombresLocalidad.has(n) ? 'Localidad (rural)'
                   : 'Sin clasificar';
  });
  estado.participaciones.forEach(p => {
    const n = norm(p.colonia_comunidad || p.colonia_oficial);
    p._asentamiento = estado.nombresColonia.has(n) ? 'Colonia (urbano)'
                    : estado.nombresLocalidad.has(n) ? 'Localidad (rural)'
                    : 'Sin clasificar';
  });
}

/* Prioridades: columnas propias o, si la migración no corrió, dentro de `otros`. */
function leerPrioridades(p) {
  const m = {};
  const meter = arr => { (Array.isArray(arr) ? arr : []).forEach(x => {
    if (x && x.codigo) m[x.codigo] = Number(x.orden) || null; }); };
  meter(p.prioridad_ambiental); meter(p.prioridad_territorial);
  const o = p.otros || {};
  ['_PRIORIDAD_AMBIENTAL','_PRIORIDAD_TERRITORIAL'].forEach(k => {
    if (o[k]) { try { meter(JSON.parse(o[k])); p._degradado = true; } catch (e) {} }
  });
  return m;
}
function leerUbicaciones(p) {
  const o = p.otros || {};
  if (o._UBICACIONES) { try { p._degradado = true; return JSON.parse(o._UBICACIONES); } catch (e) {} }
  return {};
}

/* Construye la fila analítica: problema + perfil heredado + geometría. */
function armarFila(cod, m, g) {
  const bloque = String(cod || '').split('.')[0];
  const geom = g.geom || null;
  const c = centro(geom, g.lat, g.lng);
  return {
    idHijo: g.idHijo,
    idMadre: m.id ?? null,
    folio: m.folio || null,
    codigo: cod,
    bloque,
    tituloBloque: TITULO_BLOQUE[bloque] || bloque,
    agenda: AGENDA_BLOQUE[bloque] || (String(cod).startsWith('AMBIENTAL') ? 'Ambiental' : 'Territorial'),
    texto: TEXTO_PROBLEMA[cod] || g.texto || cod,
    textoLibre: g.texto && !TEXTO_PROBLEMA[cod] ? g.texto : null,
    orden: g.orden ? Number(g.orden) : null,
    peso: PESO_PRIORIDAD[g.orden] || 0,
    alcance: tipoAlcance(geom, g.alcance),
    geom, lat: c ? c[0] : null, lng: c ? c[1] : null,
    /* Perfil heredado de la persona */
    colonia: m.colonia_oficial || m.colonia_comunidad || 'Sin dato',
    sexo: m.sexo || 'Sin dato',
    lgbtiq: m.lgbtiq || 'Sin dato',
    lgbtiq_cual: m.lgbtiq_cual || null,
    edad: m.edad != null ? Number(m.edad) : null,
    nacimiento: m.lugar_nacimiento || 'Sin dato',
    residencia: m.anios_residencia != null ? Number(m.anios_residencia) : null,
    escolaridad: m.escolaridad || 'Sin dato',
    ocupacion: m.ocupacion === 'Otro' && m.ocupacion_otro ? `Otro: ${m.ocupacion_otro}` : (m.ocupacion || 'Sin dato'),
    trabajo: m.lugar_trabajo || 'Sin dato',
    adscripcion: m.autoadscripcion || 'Sin dato',
    representacion: m.representacion === 'Otro' && m.representacion_otro
      ? `Otro: ${m.representacion_otro}` : (m.representacion || 'Sin dato'),
    distribuidor: m.distribuidor || 'DIRECTO',
    fecha: m._fecha && !isNaN(m._fecha) ? m._fecha : null,
    precision_m: m.precision_m != null ? Number(m.precision_m) : null,
    asentamiento: 'Sin clasificar'
  };
}


/* ============================================================================
   PARTE B — DIMENSIONES, FILTROS Y MÉTRICAS
   Un solo catálogo de dimensiones alimenta los filtros, los tops, las gráficas
   y la matriz de cruce. Agregar una variable aquí la habilita en todo el
   tablero sin tocar nada más.
   ============================================================================ */

function rangoEdad(e) {
  if (e == null || isNaN(e)) return 'Sin dato';
  if (e < 18) return '12 a 17';
  if (e < 30) return '18 a 29';
  if (e < 45) return '30 a 44';
  if (e < 60) return '45 a 59';
  return '60 y más';
}
function rangoResidencia(a) {
  if (a == null || isNaN(a)) return 'Sin dato';
  if (a < 5) return 'Menos de 5 años';
  if (a < 15) return '5 a 14 años';
  if (a < 30) return '15 a 29 años';
  return '30 años o más';
}
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const DIM = {
  colonia:        { et:'Colonia o comunidad',  get:f => f.colonia,        grupo:'Territorio', buscar:true },
  asentamiento:   { et:'Tipo de asentamiento', get:f => f.asentamiento,   grupo:'Territorio' },
  agenda:         { et:'Agenda',               get:f => f.agenda,         grupo:'Problema' },
  bloque:         { et:'Tema',                 get:f => f.tituloBloque,   grupo:'Problema' },
  problema:       { et:'Problema',             get:f => f.texto,          grupo:'Problema', buscar:true },
  codigo:         { et:'Código de problema',   get:f => f.codigo,         grupo:'Problema', buscar:true },
  prioridad:      { et:'Lugar en la prioridad',get:f => f.orden ? `${f.orden}.º más grave` : 'No priorizado', grupo:'Problema' },
  sexo:           { et:'Sexo',                 get:f => f.sexo,           grupo:'Persona' },
  edad:           { et:'Grupo de edad',        get:f => rangoEdad(f.edad),grupo:'Persona' },
  escolaridad:    { et:'Escolaridad',          get:f => f.escolaridad,    grupo:'Persona' },
  ocupacion:      { et:'Ocupación',            get:f => f.ocupacion,      grupo:'Persona' },
  nacimiento:     { et:'Lugar de nacimiento',  get:f => f.nacimiento,     grupo:'Persona' },
  residencia:     { et:'Años de residencia',   get:f => rangoResidencia(f.residencia), grupo:'Persona' },
  adscripcion:    { et:'Autoadscripción',      get:f => f.adscripcion,    grupo:'Persona' },
  lgbtiq:         { et:'Población LGBTIQ+',    get:f => f.lgbtiq,         grupo:'Persona' },
  trabajo:        { et:'Lugar de trabajo',     get:f => f.trabajo,        grupo:'Persona' },
  representacion: { et:'Carácter con que participa', get:f => f.representacion, grupo:'Persona' },
  alcance:        { et:'Alcance del trazo',    get:f => ({punto:'Punto',linea:'Línea',poligono:'Polígono'})[f.alcance] || f.alcance, grupo:'Levantamiento' },
  distribuidor:   { et:'Quién lo aplicó',      get:f => f.distribuidor,   grupo:'Levantamiento' },
  mes:            { et:'Mes de captura',       get:f => f.fecha ? `${f.fecha.getFullYear()}-${String(f.fecha.getMonth()+1).padStart(2,'0')} ${MES[f.fecha.getMonth()]}` : 'Sin fecha', grupo:'Levantamiento' }
};
const CLAVES_DIM = Object.keys(DIM);

/* ---- Filtrado ---- */
function pasaFiltros(f, salvo) {
  for (const k of CLAVES_DIM) {
    if (k === salvo) continue;
    const set = filtros[k];
    if (set && set.size && !set.has(DIM[k].get(f))) return false;
  }
  if (rangos.folioId != null && f.idMadre !== rangos.folioId) return false;
  if (rangos.soloPriorizados && !f.orden) return false;
  if (rangos.edadMin != null && (f.edad == null || f.edad < rangos.edadMin)) return false;
  if (rangos.edadMax != null && (f.edad == null || f.edad > rangos.edadMax)) return false;
  if (rangos.fechaIni && (!f.fecha || f.fecha < rangos.fechaIni)) return false;
  if (rangos.fechaFin && (!f.fecha || f.fecha > rangos.fechaFin)) return false;
  if (areaSeleccion && !dentroDelArea(f)) return false;
  return true;
}
function dentroDelArea(f) {
  if (f._enArea !== undefined && f._areaSello === areaSeleccion) return f._enArea;
  let r = false;
  try {
    if (f.geom) r = turf.booleanIntersects({ type:'Feature', geometry:f.geom, properties:{} }, areaSeleccion);
    else if (f.lat != null) r = turf.booleanPointInPolygon(turf.point([f.lng, f.lat]), areaSeleccion);
  } catch (e) { r = false; }
  f._enArea = r; f._areaSello = areaSeleccion;
  return r;
}

let cacheFiltrado = null, selloCache = 0;
function filtrado() {
  if (cacheFiltrado && selloCache === sello()) return cacheFiltrado;
  cacheFiltrado = estado.problemas.filter(f => pasaFiltros(f));
  selloCache = sello();
  return cacheFiltrado;
}
function sello() {
  let s = (areaSeleccion ? 1 : 0) + (rangos.soloPriorizados ? 2 : 0) + (rangos.folioId || 0) * 13;
  s += (rangos.edadMin ?? 0) * 7 + (rangos.edadMax ?? 0) * 11;
  s += (rangos.fechaIni ? rangos.fechaIni.getTime() : 0) / 1e6;
  s += (rangos.fechaFin ? rangos.fechaFin.getTime() : 0) / 1e7;
  CLAVES_DIM.forEach((k, i) => { const st = filtros[k]; if (st) s += (i + 3) * (st.size + 1) * 1.7; });
  return s;
}
function invalidar() { cacheFiltrado = null; selloCache = -1; }

/* Personas (cuestionarios) que sobreviven a los filtros de persona.
   Se usa para KPIs y para el perfil de quien participa, donde contar
   menciones inflaría a quien marcó muchos problemas. */
function personasFiltradas() {
  const ids = new Set(filtrado().map(f => f.idMadre));
  return estado.participaciones.filter(p => ids.has(p.id));
}

/* ---- Métricas ---- */
const METRICA = {
  menciones: { et:'Menciones', calc: filas => filas.length },
  personas:  { et:'Personas',  calc: filas => new Set(filas.map(f => f.idMadre)).size },
  ipp:       { et:'Índice de prioridad', calc: filas => filas.reduce((a, f) => a + f.peso, 0) }
};

/* Agrupa filas por una dimensión y devuelve [{clave, valor, filas}] ordenado. */
function agrupar(filas, dim, metrica = 'menciones', tope = 0) {
  const mapa = new Map();
  const get = DIM[dim].get;
  filas.forEach(f => {
    const k = get(f) ?? 'Sin dato';
    if (!mapa.has(k)) mapa.set(k, []);
    mapa.get(k).push(f);
  });
  let salida = [...mapa.entries()].map(([clave, fs]) => ({
    clave, filas: fs, valor: METRICA[metrica].calc(fs)
  })).sort((a, b) => b.valor - a.valor || String(a.clave).localeCompare(String(b.clave), 'es'));
  if (tope > 0 && salida.length > tope) salida = salida.slice(0, tope);
  return salida;
}

/* Matriz de cruce: filas × columnas con la métrica elegida. */
function cruzar(filas, dimFila, dimCol, metrica, topeF = 25, topeC = 15) {
  const gf = agrupar(filas, dimFila, metrica, topeF);
  const gc = agrupar(filas, dimCol, metrica, topeC);
  const clavesCol = gc.map(g => g.clave);
  const getC = DIM[dimCol].get;
  const matriz = gf.map(g => {
    const cubos = new Map(clavesCol.map(c => [c, []]));
    g.filas.forEach(f => { const c = getC(f); if (cubos.has(c)) cubos.get(c).push(f); });
    return {
      clave: g.clave, total: g.valor,
      celdas: clavesCol.map(c => METRICA[metrica].calc(cubos.get(c)))
    };
  });
  return { clavesCol, matriz, totalesCol: gc.map(g => g.valor), total: METRICA[metrica].calc(filas) };
}

/* ---- Paletas ---- */
const COLOR_AGENDA = { Ambiental:'#10b981', Territorial:'#f59e0b' };
const ACENTO = '#34d399';
const NEUTRO = '#2C6C66';   // barra de contraste, mismo verde apagado del portal
const PALETA = ['#34d399','#38bdf8','#f59e0b','#a78bfa','#f472b6','#facc15','#4ade80',
                '#fb923c','#60a5fa','#c084fc','#2dd4bf','#f87171','#94a3b8','#e879f9'];
const RAMPA = ['#ffffb2','#fed976','#feb24c','#fd8d3c','#f03b20','#bd0026'];  // YlOrRd
function colorRampa(v, max) {
  if (!max || v <= 0) return '#123B36';
  const i = Math.min(RAMPA.length - 1, Math.floor(v / max * RAMPA.length * 0.999));
  return RAMPA[i];
}
function colorDe(clave, i) {
  if (COLOR_AGENDA[clave]) return COLOR_AGENDA[clave];
  return PALETA[i % PALETA.length];
}
function cortar(s, n = 46) {
  s = String(s ?? '');
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

          ${visibles.length === 0 ? '<div style="padding:6px;color:var(--texto-tenue);font-size:11px;">Sin coincidencias</div>' : ''}
          ${visibles.slice(0, 400).map(o => `

        </div></div>`;
    });
  });

  /* Rangos numéricos y de fecha, que no caben en listas de casillas */
  html += `<div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;
           color:var(--texto-tenue);font-weight:700;margin:14px 0 4px;">Rangos</div>
    <div class="f-grupo abierto"><div class="f-lista" style="max-height:none;display:block;">
      <label class="f-op" style="padding-left:0;"><input type="checkbox" id="r-prio"
        ${rangos.soloPriorizados ? 'checked' : ''}><span class="t">Solo problemas priorizados</span></label>
      <div style="font-size:10.5px;color:var(--texto-tenue);margin-top:7px;">Edad exacta</div>
      <div class="f-rango">
        <input type="number" id="r-edad-min" placeholder="mín" value="${rangos.edadMin ?? ''}" min="0" max="120">
        <input type="number" id="r-edad-max" placeholder="máx" value="${rangos.edadMax ?? ''}" min="0" max="120">
      </div>
      <div style="font-size:10.5px;color:var(--texto-tenue);margin-top:7px;">Fecha de captura</div>
      <div class="f-rango">
        <input type="date" id="r-fecha-ini" value="${rangos.fechaIni ? rangos.fechaIni.toISOString().slice(0,10) : ''}">
        <input type="date" id="r-fecha-fin" value="${rangos.fechaFin ? rangos.fechaFin.toISOString().slice(0,10) : ''}">
      </div>
    </div></div>`;

  cont.innerHTML = html;
  cont.scrollTop = guardarScroll;

  cont.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    b.closest('.f-grupo').classList.toggle('abierto');
  });
  cont.querySelectorAll('.f-op input[data-dim]').forEach(chk => chk.onchange = () => {
    alternarFiltro(chk.dataset.dim, chk.value, chk.checked);
  });
  cont.querySelectorAll('.f-buscar').forEach(inp => {
    let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(pintarFiltros, 250); };
  });
  document.getElementById('r-prio').onchange = e => { rangos.soloPriorizados = e.target.checked; refrescar(); };
  const numCambio = (id, campo) => {
    const el = document.getElementById(id);
    el.onchange = () => { const v = el.value === '' ? null : Number(el.value);
      rangos[campo] = (v === null || isNaN(v)) ? null : v; refrescar(); };
  };
  numCambio('r-edad-min','edadMin'); numCambio('r-edad-max','edadMax');
  ['r-fecha-ini','r-fecha-fin'].forEach((id, i) => {
    document.getElementById(id).onchange = e => {
      const campo = i === 0 ? 'fechaIni' : 'fechaFin';
      if (!e.target.value) { rangos[campo] = null; }
      else { const d = new Date(e.target.value + (i === 0 ? 'T00:00:00' : 'T23:59:59')); rangos[campo] = d; }
      refrescar();
    };
  });
}

function alternarFiltro(dim, valor, encender) {
  if (!filtros[dim]) filtros[dim] = new Set();
  if (encender) filtros[dim].add(valor); else filtros[dim].delete(valor);
  if (!filtros[dim].size) delete filtros[dim];
  refrescar();
}
function limpiarFiltros() {
  CLAVES_DIM.forEach(k => delete filtros[k]);
  rangos.edadMin = rangos.edadMax = rangos.fechaIni = rangos.fechaFin = null;
  rangos.soloPriorizados = false;
  rangos.folio = null; rangos.folioId = null;
  quitarSeleccion(true);
  refrescar();
}
function pintarChips() {
  const cont = document.getElementById('chips-activos');
  const chips = [];
  CLAVES_DIM.forEach(k => { if (filtros[k]) filtros[k].forEach(v =>
    chips.push(`<span class="chip">${esc(cortar(v, 26))}<button data-dim="${k}" data-val="${esc(v)}" aria-label="Quitar">×</button></span>`)); });
  if (rangos.soloPriorizados) chips.push(`<span class="chip">solo priorizados<button data-especial="prio">×</button></span>`);
  if (rangos.edadMin != null || rangos.edadMax != null)
    chips.push(`<span class="chip">edad ${rangos.edadMin ?? '·'}–${rangos.edadMax ?? '·'}<button data-especial="edad">×</button></span>`);
  if (rangos.fechaIni || rangos.fechaFin)
    chips.push(`<span class="chip">fechas<button data-especial="fecha">×</button></span>`);
  if (rangos.folioId != null) chips.push(`<span class="chip">folio ${esc(rangos.folio || rangos.folioId)}<button data-especial="folio">×</button></span>`);
  if (areaSeleccion) chips.push(`<span class="chip">área dibujada<button data-especial="area">×</button></span>`);
  cont.innerHTML = chips.join('');
  cont.querySelectorAll('button[data-dim]').forEach(b => b.onclick = () =>
    alternarFiltro(b.dataset.dim, b.dataset.val, false));
  cont.querySelectorAll('button[data-especial]').forEach(b => b.onclick = () => {
    const e = b.dataset.especial;
    if (e === 'prio') rangos.soloPriorizados = false;
    if (e === 'edad') { rangos.edadMin = rangos.edadMax = null; }
    if (e === 'fecha') { rangos.fechaIni = rangos.fechaFin = null; }
    if (e === 'folio') { rangos.folio = null; rangos.folioId = null; }
    if (e === 'area') { quitarSeleccion(true); }
    refrescar();
  });
}

/* ============================================================================
   MAPA
   ============================================================================ */
let mapa, capaBase, capaDatos, capaCluster, capaCalor, capaCoropleta, capaVacios, capaDibujo;
let modoMapa = 'puntos', pesarCalor = false, mostrarVacios = false, baseActual = 0;

const BASES = [
  { et:'Satélite', crear: () => L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom:22, maxNativeZoom:19, attribution:'Imagen © Esri' }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
        { maxZoom:22, maxNativeZoom:19 })]) },
  { et:'Oscuro', crear: () => L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      { maxZoom:20, attribution:'© OpenStreetMap, © CARTO' }) },
  { et:'Claro', crear: () => L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      { maxZoom:20, attribution:'© OpenStreetMap, © CARTO' }) },
  { et:'Calles', crear: () => L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom:19, attribution:'© OpenStreetMap' }) }
];

function iniciarMapa() {
  mapa = L.map('mapa', {
    maxBounds: L.latLngBounds([19.8, -103.2], [22.2, -100.4]),
    maxBoundsViscosity: .7, minZoom: 9, maxZoom: 21, zoomControl: true
  }).setView([CENTRO.lat, CENTRO.lng], 12);
  capaBase = BASES[0].crear().addTo(mapa);
  L.control.scale({ imperial:false }).addTo(mapa);

  capaDibujo = new L.FeatureGroup().addTo(mapa);
  mapa.on(L.Draw.Event.CREATED, e => {
    capaDibujo.clearLayers();
    capaDibujo.addLayer(e.layer);
    areaSeleccion = e.layer.toGeoJSON().geometry;
    estado.problemas.forEach(f => { f._enArea = undefined; });
    apagarLazo();
    document.getElementById('sel-activa').classList.add('visible');
    refrescar();
  });

  document.querySelectorAll('.mapa-barra [data-modo]').forEach(b => b.onclick = () => {
    modoMapa = b.dataset.modo;
    document.querySelectorAll('.mapa-barra [data-modo]').forEach(x =>
      x.setAttribute('aria-pressed', String(x === b)));
    pintarMapa();
  });
  document.getElementById('btn-base').onclick = () => {
    baseActual = (baseActual + 1) % BASES.length;
    mapa.removeLayer(capaBase);
    capaBase = BASES[baseActual].crear().addTo(mapa);
    if (capaBase.bringToBack) capaBase.bringToBack();
    document.getElementById('btn-base').textContent = BASES[baseActual].et;
  };
  document.getElementById('btn-peso-calor').onclick = e => {
    pesarCalor = !pesarCalor;
    e.currentTarget.setAttribute('aria-pressed', String(pesarCalor));
    if (modoMapa === 'calor') pintarMapa();
  };
  document.getElementById('btn-vacios').onclick = e => {
    mostrarVacios = !mostrarVacios;
    e.currentTarget.setAttribute('aria-pressed', String(mostrarVacios));
    pintarMapa();
  };
  document.getElementById('btn-encuadrar').onclick = encuadrar;
  document.getElementById('btn-lazo').onclick = alternarLazo;
  document.getElementById('btn-quitar-sel').onclick = () => { quitarSeleccion(true); refrescar(); };
}

let dibujante = null;
function alternarLazo() {
  const b = document.getElementById('btn-lazo');
  if (dibujante) { apagarLazo(); return; }
  dibujante = new L.Draw.Polygon(mapa, { shapeOptions:{ color:'#34d399', weight:2, fillOpacity:.08 } });
  dibujante.enable();
  b.setAttribute('aria-pressed','true');
  toast('Haga clic para trazar el área y cierre el polígono en el primer punto');
}
function apagarLazo() {
  if (dibujante) { try { dibujante.disable(); } catch (e) {} dibujante = null; }
  document.getElementById('btn-lazo').setAttribute('aria-pressed','false');
}
function quitarSeleccion(silencio) {
  areaSeleccion = null;
  if (capaDibujo) capaDibujo.clearLayers();
  estado.problemas.forEach(f => { f._enArea = undefined; });
  document.getElementById('sel-activa').classList.remove('visible');
  if (!silencio) refrescar();
}

function limpiarCapas() {
  [capaDatos, capaCluster, capaCalor, capaCoropleta, capaVacios].forEach(c => {
    if (c && mapa.hasLayer(c)) mapa.removeLayer(c);
  });
  capaDatos = capaCluster = capaCalor = capaCoropleta = null;
  if (capaVacios) { capaVacios = null; }
}

function pintarMapa() {
  limpiarCapas();
  const filas = filtrado();
  const conGeo = filas.filter(f => f.lat != null && f.lng != null);

  if (mostrarVacios) pintarVacios();

  if (modoMapa === 'coropleta') { pintarCoropleta(filas); pintarLeyenda('coropleta', filas); return; }

  if (modoMapa === 'calor') {
    const puntos = conGeo.map(f => [f.lat, f.lng, pesarCalor ? (f.peso || .35) : .6]);
    capaCalor = L.heatLayer(puntos, { radius:24, blur:18, maxZoom:17, minOpacity:.32,
      gradient:{0:'#0F3B38',.3:'#34d399',.55:'#a3e635',.78:'#facc15',1:'#ef4444'} }).addTo(mapa);
    pintarLeyenda('calor', filas);
    return;
  }

  const grupo = modoMapa === 'cluster'
    ? L.markerClusterGroup({ chunkedLoading:true, maxClusterRadius:48, spiderfyOnMaxZoom:true,
        iconCreateFunction: c => {
          const n = c.getChildCount();
          const t = n < 10 ? 30 : n < 50 ? 36 : n < 200 ? 42 : 48;
          return L.divIcon({ html:`<div style="background:rgba(52,211,153,.88);color:#06251F;
            width:${t}px;height:${t}px;border-radius:50%;display:flex;align-items:center;
            justify-content:center;font-family:var(--mono);font-weight:600;font-size:${t/3.2}px;
            border:2px solid rgba(255,255,255,.75);">${n}</div>`,
            className:'', iconSize:[t,t] });
        } })
    : L.featureGroup();

  /* Tope de dibujo: por encima de ~6,000 formas el navegador se arrastra.
     Se avisa en vez de congelar el tablero en silencio. */
  const TOPE = modoMapa === 'cluster' ? 20000 : 6000;
  const dibujables = conGeo.slice(0, TOPE);
  if (conGeo.length > TOPE) toast(`Se dibujan ${num(TOPE)} de ${num(conGeo.length)} registros. Use Agrupado o Calor para verlos todos.`, 4200);

  dibujables.forEach(f => {
    const color = COLOR_AGENDA[f.agenda] || ACENTO;
    let capa;
    if (f.geom && f.geom.type !== 'Point' && f.alcance !== 'punto') {
      capa = L.geoJSON(f.geom, { style:{ color, weight:2.4, fillOpacity:.16, fillColor:color },
        pointToLayer:(x, ll) => L.circleMarker(ll, { radius:5, color }) });
    } else {
      const r = f.orden ? 4 + (4 - f.orden) * 1.6 : 4.2;
      capa = L.circleMarker([f.lat, f.lng], { radius:r, color:'rgba(255,255,255,.8)', weight:1.2,
        fillColor:color, fillOpacity: f.orden ? .95 : .62, className:'marcador' });
    }
    capa.bindPopup(popupProblema(f), { maxWidth:330 });
    grupo.addLayer(capa);
  });

  if (modoMapa === 'cluster') { capaCluster = grupo.addTo(mapa); }
  else { capaDatos = grupo.addTo(mapa); }
  pintarLeyenda('puntos', filas);
}

function popupProblema(f) {
  const p = f.agenda === 'Ambiental' ? 'amb' : 'ter';
  const fila = (k, v) => v && v !== 'Sin dato'
    ? `<div style="display:flex;gap:8px;"><span style="color:var(--texto-tenue);min-width:82px;">${k}</span>
       <span>${esc(v)}</span></div>` : '';
  return `<div>
    <span class="pill ${p}">${esc(f.agenda)}</span>
    ${f.orden ? `<span class="pill" style="background:rgba(52,211,153,.2);color:#6ee7b7;">${f.orden}.º más grave</span>` : ''}
    <div style="font-weight:600;margin:6px 0 3px;line-height:1.35;">${esc(f.texto)}</div>
    <div class="cod">${esc(f.codigo)} · ${esc(f.tituloBloque)}</div>
    <div style="margin-top:7px;font-size:11.5px;display:grid;gap:2px;">
      ${fila('Colonia', f.colonia)}
      ${fila('Asentamiento', f.asentamiento)}
      ${fila('Reporta', [f.sexo, f.edad ? f.edad + ' años' : null].filter(Boolean).join(', '))}
      ${fila('Carácter', f.representacion)}
      ${fila('Ocupación', f.ocupacion)}
      ${fila('Trazo', ({punto:'Punto',linea:'Línea',poligono:'Polígono'})[f.alcance])}
      ${f.folio ? `<div style="display:flex;gap:8px;"><span style="color:var(--texto-tenue);min-width:82px;">Folio</span><a href="#" onclick="abrirFolio(${f.idMadre});return false;" style="color:var(--acento);">${esc(f.folio)}</a></div>` : ''}
      ${fila('Capturado', f.fecha ? f.fecha.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}) : null)}
      ${f.precision_m != null ? fila('Precisión GPS', `±${Math.round(f.precision_m)} m`) : ''}
    </div>
    ${f.textoLibre ? `<div style="margin-top:7px;padding-top:6px;border-top:1px solid var(--linea);
      font-style:italic;color:var(--texto-medio);">"${esc(f.textoLibre)}"</div>` : ''}
    <div style="margin-top:8px;"><button class="btn chico"
      onclick="filtrarColoniaDesdeMapa('${esc(f.colonia).replace(/'/g,"\\'")}')">Ver solo esta colonia</button></div>
  </div>`;
}
function filtrarColoniaDesdeMapa(nombre) {
  filtros.colonia = new Set([nombre]);
  mapa.closePopup(); refrescar();
}

/* Coropleta: agregación por colonia. La unión es por nombre del padrón, que es
   obligatorio en el formulario, así que no hay grafías sueltas que conciliar. */
function agregadoPorColonia(filas) {
  const mapaCol = new Map();
  filas.forEach(f => {
    const k = norm(f.colonia);
    if (!mapaCol.has(k)) mapaCol.set(k, { nombre:f.colonia, filas:[] });
    mapaCol.get(k).filas.push(f);
  });
  return mapaCol;
}
function pintarCoropleta(filas) {
  if (!estado.colonias.length) { toast('El padrón de colonias no cargó; no se puede colorear por polígono.'); return; }
  const agr = agregadoPorColonia(filas);
  const metrica = document.getElementById('der-metrica').value;
  const valores = [...agr.values()].map(a => METRICA[metrica].calc(a.filas));
  const max = Math.max(1, ...valores);
  const feats = estado.colonias.filter(c => c.geometry).map(c => {
    const a = agr.get(norm(c.nombre));
    const v = a ? METRICA[metrica].calc(a.filas) : 0;
    const top = a ? agrupar(a.filas, 'problema', 'menciones', 1)[0] : null;
    return { type:'Feature', geometry:c.geometry, properties:{
      nombre:c.nombre, valor:v, personas: a ? new Set(a.filas.map(f => f.idMadre)).size : 0,
      ipp: a ? a.filas.reduce((s, f) => s + f.peso, 0) : 0,
      top: top ? `${top.clave} (${top.valor})` : '—' } };
  });
  capaCoropleta = L.geoJSON({ type:'FeatureCollection', features:feats }, {
    style: f => ({ color:'#0B2A27', weight:.9, opacity:.85,
      fillColor: colorRampa(f.properties.valor, max),
      fillOpacity: f.properties.valor > 0 ? .74 : .09 }),
    onEachFeature: (f, capa) => {
      const p = f.properties;
      capa.bindPopup(`<div><div style="font-weight:600;margin-bottom:4px;">${esc(p.nombre)}</div>
        <div style="display:grid;gap:2px;font-size:11.5px;">
          <div>Menciones: <b style="font-family:var(--mono)">${num(p.valor)}</b></div>
          <div>Personas: <b style="font-family:var(--mono)">${num(p.personas)}</b></div>
          <div>Índice de prioridad: <b style="font-family:var(--mono)">${num(p.ipp)}</b></div>
          <div style="color:var(--texto-medio);margin-top:3px;">Más mencionado: ${esc(cortar(p.top, 54))}</div>
        </div>
        <div style="margin-top:8px;"><button class="btn chico"
          onclick="filtrarColoniaDesdeMapa('${esc(p.nombre).replace(/'/g,"\\'")}')">Ver solo esta colonia</button></div>
      </div>`);
      capa.on('mouseover', () => capa.setStyle({ weight:2.4, color:'#34d399' }));
      capa.on('mouseout', () => capa.setStyle({ weight:.9, color:'#0B2A27' }));
    }
  }).addTo(mapa);
  capaCoropleta._max = max;
}

/* Vacíos de levantamiento: colonias del padrón sin una sola respuesta. Es la
   capa que dice dónde falta trabajo de campo, no dónde ya se hizo. */
function pintarVacios() {
  const conDatos = new Set(estado.problemas.map(f => norm(f.colonia)));
  const feats = estado.colonias.filter(c => c.geometry && !conDatos.has(norm(c.nombre)))
    .map(c => ({ type:'Feature', geometry:c.geometry, properties:{ nombre:c.nombre } }));
  if (!feats.length) return;
  capaVacios = L.geoJSON({ type:'FeatureCollection', features:feats }, {
    style: { color:'#f87171', weight:1.5, dashArray:'4 3', fillColor:'#f87171', fillOpacity:.13 },
    onEachFeature: (f, c) => c.bindPopup(`<b>${esc(f.properties.nombre)}</b><br>
      <span style="color:var(--texto-medio)">Sin ninguna respuesta registrada.</span>`)
  }).addTo(mapa);
  if (capaVacios.bringToBack) capaVacios.bringToBack();
}

function pintarLeyenda(modo, filas) {
  const l = document.getElementById('leyenda');
  let html = '';
  if (modo === 'coropleta') {
    const max = capaCoropleta ? capaCoropleta._max : 1;
    const paso = Math.max(1, Math.ceil(max / RAMPA.length));
    html = `<h4>Menciones por colonia</h4>` + RAMPA.map((c, i) =>
      `<div class="ley-fila"><span class="ley-caja" style="background:${c}"></span>
       ${i * paso + (i ? 1 : 0)}${i === RAMPA.length - 1 ? ' y más' : ' a ' + Math.min(max, (i + 1) * paso)}</div>`).join('')
      + `<div class="ley-fila"><span class="ley-caja" style="background:#123B36"></span>Sin respuestas</div>`;
  } else if (modo === 'calor') {
    html = `<h4>Densidad ${pesarCalor ? 'ponderada por prioridad' : 'de menciones'}</h4>
      <div style="height:9px;border-radius:5px;background:linear-gradient(90deg,#0F3B38,#34d399,#a3e635,#facc15,#ef4444);margin:4px 0;"></div>
      <div style="display:flex;justify-content:space-between;color:var(--texto-tenue);font-size:10px;">
        <span>menos</span><span>más</span></div>
      <div style="color:var(--texto-tenue);font-size:9.5px;margin-top:4px;line-height:1.4;">
        Guía visual con radio en píxeles, no una densidad de kernel analítica.</div>`;
  } else {
    const amb = filas.filter(f => f.agenda === 'Ambiental').length;
    html = `<h4>Agenda</h4>
      <div class="ley-fila"><span class="ley-caja" style="background:${COLOR_AGENDA.Ambiental}"></span>Ambiental · ${num(amb)}</div>
      <div class="ley-fila"><span class="ley-caja" style="background:${COLOR_AGENDA.Territorial}"></span>Territorial · ${num(filas.length - amb)}</div>
      <div class="ley-fila" style="margin-top:4px;color:var(--texto-tenue);font-size:10px;">
        El punto grande es un problema priorizado</div>`;
  }
  if (mostrarVacios) html += `<div class="ley-fila" style="margin-top:5px;">
    <span class="ley-caja" style="background:rgba(248,113,113,.35);border-color:#f87171"></span>Colonia sin respuestas</div>`;
  l.innerHTML = html;
}

function encuadrar() {
  const filas = filtrado().filter(f => f.lat != null);
  if (!filas.length) { toast('No hay registros con ubicación en este filtro'); return; }
  const b = L.latLngBounds(filas.map(f => [f.lat, f.lng]));
  if (b.isValid()) mapa.fitBounds(b.pad(.12));
}


/* ============================================================================
   PARTE D — KPIs, PANELES Y GRÁFICAS
   ============================================================================ */

Chart.defaults.color = '#D1D5DB';
Chart.defaults.font.family = "'Inter',system-ui,sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.borderColor = '#1A5C56';
Chart.defaults.plugins.legend.labels.boxWidth = 11;
Chart.defaults.plugins.legend.labels.boxHeight = 11;
Chart.defaults.plugins.legend.labels.padding = 11;
Chart.defaults.plugins.tooltip.backgroundColor = '#14403C';
Chart.defaults.plugins.tooltip.borderColor = '#1A5C56';
Chart.defaults.plugins.tooltip.borderWidth = 1;
Chart.defaults.plugins.tooltip.titleColor = '#FFFFFF';
Chart.defaults.plugins.tooltip.bodyColor = '#D1D5DB';
Chart.defaults.plugins.tooltip.padding = 9;
Chart.defaults.maintainAspectRatio = false;

const graficas = {};
function pintar(id, cfg) {
  const c = document.getElementById(id);
  if (!c) return;
  if (graficas[id]) graficas[id].destroy();
  graficas[id] = new Chart(c, cfg);
}
const EJE_X = { grid:{ color:'rgba(255,255,255,.08)' }, ticks:{ maxRotation:0, autoSkip:true } };
const EJE_Y = { grid:{ color:'rgba(255,255,255,.08)' }, beginAtZero:true, ticks:{ precision:0 } };
const SIN_EJE = { grid:{ display:false } };

/* Clic en una barra = filtro. Es lo que convierte las gráficas en navegación. */
function alClicarBarra(dim, etiquetas) {
  return (evt, elems) => {
    if (!elems.length) return;
    const v = etiquetas[elems[0].index];
    if (v == null) return;
    alternarFiltro(dim, v, !(filtros[dim] && filtros[dim].has(v)));
  };
}

/* ---------- KPIs ---------- */
function pintarKPIs() {
  const filas = filtrado();
  const personas = new Set(filas.map(f => f.idMadre)).size;
  const colonias = new Set(filas.map(f => norm(f.colonia))).size;
  const amb = filas.filter(f => f.agenda === 'Ambiental').length;
  const priorizados = filas.filter(f => f.orden).length;
  const conGeo = filas.filter(f => f.lat != null).length;
  const padron = estado.colonias.length + estado.localidades.length;

  const k = [
    ['Cuestionarios', num(personas), ''],
    ['Problemas señalados', num(filas.length), 'ac'],
    ['Ambiental', num(amb), 'amb'],
    ['Territorial', num(filas.length - amb), 'ter'],
    ['Colonias con voz', num(colonias) + (padron ? ` <span style="font-size:11px;color:var(--texto-tenue)">/ ${num(padron)}</span>` : ''), ''],
    ['Problemas por persona', personas ? (filas.length / personas).toFixed(1) : '—', ''],
    ['Priorizados', pct(priorizados, filas.length), ''],
    ['Con ubicación', pct(conGeo, filas.length), '']
  ];
  document.getElementById('kpis').innerHTML = k.map(([et, v, cls]) =>
    `<div class="kpi ${cls}"><div class="v">${v}</div><div class="k">${et}</div></div>`).join('');
}

/* ---------- Panorama ---------- */
function pintarPanorama() {
  const filas = filtrado();
  const m = document.getElementById('sel-top-metrica').value;

  const av = document.getElementById('avisos');
  av.innerHTML = estado.avisos.map(a => `<div class="aviso">${a}</div>`).join('');

  const top = agrupar(filas, 'problema', m, 15);
  pintar('g-problemas', {
    type:'bar',
    data:{ labels: top.map(t => cortar(t.clave, 62)),
      datasets:[{ data: top.map(t => t.valor), borderRadius:3,
        backgroundColor: top.map(t => COLOR_AGENDA[t.filas[0].agenda]) }] },
    options:{ indexAxis:'y', plugins:{ legend:{ display:false },
      tooltip:{ callbacks:{ afterLabel: c => {
        const g = top[c.dataIndex];
        return `${g.filas[0].codigo} · ${new Set(g.filas.map(f => f.colonia)).size} colonias`; } } } },
      scales:{ x:EJE_Y, y:{ ...SIN_EJE, ticks:{ font:{ size:10.5 } } } },
      onClick: alClicarBarra('problema', top.map(t => t.clave)) }
  });

  const bl = agrupar(filas, 'bloque', m);
  pintar('g-bloques', {
    type:'bar',
    data:{ labels: bl.map(b => cortar(b.clave, 34)),
      datasets:[{ data: bl.map(b => b.valor), borderRadius:3,
        backgroundColor: bl.map(b => COLOR_AGENDA[b.filas[0].agenda]) }] },
    options:{ indexAxis:'y', plugins:{ legend:{ display:false } },
      scales:{ x:EJE_Y, y:{ ...SIN_EJE, ticks:{ font:{ size:10 } } } },
      onClick: alClicarBarra('bloque', bl.map(b => b.clave)) }
  });

  const col = agrupar(filas, 'colonia', m, 15);
  pintar('g-colonias', {
    type:'bar',
    data:{ labels: col.map(c => cortar(c.clave, 30)),
      datasets:[{ data: col.map(c => c.valor), borderRadius:3, backgroundColor:ACENTO }] },
    options:{ indexAxis:'y', plugins:{ legend:{ display:false },
      tooltip:{ callbacks:{ afterLabel: c => `${new Set(col[c.dataIndex].filas.map(f => f.idMadre)).size} personas` } } },
      scales:{ x:EJE_Y, y:{ ...SIN_EJE, ticks:{ font:{ size:10 } } } },
      onClick: alClicarBarra('colonia', col.map(c => c.clave)) }
  });

  const amb = filas.filter(f => f.agenda === 'Ambiental');
  const ter = filas.filter(f => f.agenda === 'Territorial');
  pintar('g-agenda', {
    type:'bar',
    data:{ labels:['Menciones','Personas','Índice de prioridad'],
      datasets:[
        { label:'Ambiental', backgroundColor:COLOR_AGENDA.Ambiental, borderRadius:3,
          data:[amb.length, new Set(amb.map(f => f.idMadre)).size, amb.reduce((a,f)=>a+f.peso,0)] },
        { label:'Territorial', backgroundColor:COLOR_AGENDA.Territorial, borderRadius:3,
          data:[ter.length, new Set(ter.map(f => f.idMadre)).size, ter.reduce((a,f)=>a+f.peso,0)] }] },
    options:{ scales:{ x:{ ...SIN_EJE, stacked:false }, y:EJE_Y } }
  });

  const tipos = agrupar(filas, 'asentamiento', 'menciones').filter(a => a.clave !== 'Sin clasificar');
  const temas = agrupar(filas, 'bloque', 'menciones', 10).map(b => b.clave);
  pintar('g-urbano-rural', {
    type:'radar',
    data:{ labels: temas.map(t => cortar(t, 22)),
      datasets: tipos.map((t, i) => {
        const tot = t.filas.length || 1;
        return { label:t.clave, borderColor:PALETA[i], backgroundColor:PALETA[i] + '26',
          pointBackgroundColor:PALETA[i], borderWidth:2, pointRadius:2.5,
          data: temas.map(tm => +(t.filas.filter(f => f.tituloBloque === tm).length / tot * 100).toFixed(1)) }; }) },
    options:{ scales:{ r:{ grid:{ color:'#1A5C56' }, angleLines:{ color:'rgba(255,255,255,.08)' },
      pointLabels:{ font:{ size:9.5 }, color:'#8FAAA6' }, ticks:{ display:false, backdropColor:'transparent' } } },
      plugins:{ tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${c.raw}%` } } } }
  });
}

/* ---------- Perfil ---------- */
function pintarPerfil() {
  const personas = personasFiltradas();
  const gruposEdad = ['12 a 17','18 a 29','30 a 44','45 a 59','60 y más','Sin dato'];
  const cuenta = (sexo, r) => personas.filter(p => (p.sexo || 'Sin dato') === sexo && rangoEdad(p.edad) === r).length;
  pintar('g-piramide', {
    type:'bar',
    data:{ labels:gruposEdad, datasets:[
      { label:'Mujeres', backgroundColor:'#f472b6', borderRadius:3,
        data: gruposEdad.map(r => -cuenta('Mujer', r)) },
      { label:'Hombres', backgroundColor:'#38bdf8', borderRadius:3,
        data: gruposEdad.map(r => cuenta('Hombre', r)) },
      { label:'Prefiere no decirlo o sin dato', backgroundColor:'#94a3b8', borderRadius:3,
        data: gruposEdad.map(r => cuenta('Prefiero no decirlo', r) + cuenta('Sin dato', r)) }] },
    options:{ indexAxis:'y',
      scales:{ x:{ ...EJE_X, stacked:true, ticks:{ callback: v => Math.abs(v) } },
        y:{ ...SIN_EJE, stacked:true } },
      plugins:{ tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${Math.abs(c.raw)}` } } } }
  });

  barrasSimples('g-representacion', personas, p => p.representacion === 'Otro' && p.representacion_otro
    ? 'Otro: ' + p.representacion_otro : (p.representacion || 'Sin dato'), '#a78bfa', 'y', 40);
  barrasSimples('g-escolaridad', personas, p => p.escolaridad || 'Sin dato', ACENTO, 'x', 30,
    ['No fui a la escuela','Primaria','Secundaria','Preparatoria o carrera técnica','Universidad o más','Sin dato']);
  barrasSimples('g-ocupacion', personas, p => p.ocupacion === 'Otro' && p.ocupacion_otro
    ? 'Otro: ' + p.ocupacion_otro : (p.ocupacion || 'Sin dato'), '#10b981', 'y', 40);
  barrasSimples('g-trabajo', personas, p => p.lugar_trabajo || 'Sin dato', '#f59e0b', 'y', 34);

  /* Arraigo: años de residencia contra lugar de nacimiento, apilado */
  const rangosRes = ['Menos de 5 años','5 a 14 años','15 a 29 años','30 años o más','Sin dato'];
  const nacs = [...new Set(personas.map(p => p.lugar_nacimiento || 'Sin dato'))];
  pintar('g-arraigo', {
    type:'bar',
    data:{ labels: rangosRes,
      datasets: nacs.map((n, i) => ({ label: cortar(n, 30), backgroundColor: PALETA[i % PALETA.length],
        borderRadius:2,
        data: rangosRes.map(r => personas.filter(p =>
          (p.lugar_nacimiento || 'Sin dato') === n && rangoResidencia(p.anios_residencia) === r).length) })) },
    options:{ scales:{ x:{ ...SIN_EJE, stacked:true, ticks:{ font:{ size:9.5 } } },
      y:{ ...EJE_Y, stacked:true } },
      plugins:{ legend:{ labels:{ font:{ size:9.5 } } } } }
  });

  /* Qué señala cada grupo: perfil temático en porcentaje de fila */
  const dim = document.getElementById('sel-perfil-dim').value;
  const filas = filtrado();
  const grupos = agrupar(filas, dim, 'menciones', 7);
  const temas = agrupar(filas, 'bloque', 'menciones', 12).map(b => b.clave);
  pintar('g-perfil-tema', {
    type:'bar',
    data:{ labels: temas.map(t => cortar(t, 26)),
      datasets: grupos.map((g, i) => {
        const tot = g.filas.length || 1;
        return { label: cortar(g.clave, 26), backgroundColor: PALETA[i % PALETA.length], borderRadius:2,
          data: temas.map(t => +(g.filas.filter(f => f.tituloBloque === t).length / tot * 100).toFixed(1)) }; }) },
    options:{ scales:{ x:{ ...SIN_EJE, ticks:{ font:{ size:9 }, maxRotation:48, minRotation:0 } },
      y:{ ...EJE_Y, title:{ display:true, text:'% de las menciones del grupo' } } },
      plugins:{ tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${c.raw}%` } },
        legend:{ labels:{ font:{ size:9.5 } } } } }
  });
}
function barrasSimples(id, datos, get, color, eje, tope, orden) {
  const m = new Map();
  datos.forEach(d => { const k = get(d) || 'Sin dato'; m.set(k, (m.get(k) || 0) + 1); });
  let pares = [...m.entries()];
  if (orden) pares.sort((a, b) => orden.indexOf(a[0]) - orden.indexOf(b[0]));
  else pares.sort((a, b) => b[1] - a[1]);
  if (tope) pares = pares.slice(0, tope);
  pintar(id, {
    type:'bar',
    data:{ labels: pares.map(p => cortar(p[0], eje === 'y' ? 40 : 22)),
      datasets:[{ data: pares.map(p => p[1]), backgroundColor: color, borderRadius:3 }] },
    options:{ indexAxis: eje === 'y' ? 'y' : 'x', plugins:{ legend:{ display:false } },
      scales: eje === 'y'
        ? { x:EJE_Y, y:{ ...SIN_EJE, ticks:{ font:{ size:10 } } } }
        : { x:{ ...SIN_EJE, ticks:{ font:{ size:9.5 }, maxRotation:38 } }, y:EJE_Y } }
  });
}

/* ---------- Prioridad ---------- */
function pintarPrioridad() {
  const filas = filtrado();
  const porMenciones = agrupar(filas, 'problema', 'menciones', 14);
  const claves = porMenciones.map(p => p.clave);
  const ippDe = c => filas.filter(f => f.texto === c).reduce((a, f) => a + f.peso, 0);
  pintar('g-prioridad', {
    type:'bar',
    data:{ labels: claves.map(c => cortar(c, 54)),
      datasets:[
        { label:'Menciones', backgroundColor:NEUTRO, borderRadius:3,
          data: porMenciones.map(p => p.valor) },
        { label:'Índice de prioridad', backgroundColor:ACENTO, borderRadius:3,
          data: claves.map(ippDe) }] },
    options:{ indexAxis:'y', scales:{ x:EJE_Y, y:{ ...SIN_EJE, ticks:{ font:{ size:10 } } } } }
  });

  const primeros = filas.filter(f => f.orden === 1);
  const g1 = agrupar(primeros, 'problema', 'menciones', 12);
  pintar('g-primero', {
    type:'bar',
    data:{ labels: g1.map(g => cortar(g.clave, 44)),
      datasets:[{ data: g1.map(g => g.valor), borderRadius:3,
        backgroundColor: g1.map(g => COLOR_AGENDA[g.filas[0].agenda]) }] },
    options:{ indexAxis:'y', plugins:{ legend:{ display:false } },

  });

  const sinCargo = f => /sin cargo/i.test(f.representacion);
  const ciud = filas.filter(sinCargo), repr = filas.filter(f => !sinCargo(f) && f.representacion !== 'Sin dato');

  const porc = (arr, t) => arr.length ? +(arr.filter(f => f.tituloBloque === t).length / arr.length * 100).toFixed(1) : 0;
  pintar('g-convergencia', {
    type:'bar',
    data:{ labels: temas.map(t => cortar(t, 26)),
      datasets:[
        { label:`Ciudadanía (${num(new Set(ciud.map(f=>f.idMadre)).size)})`, backgroundColor:ACENTO, borderRadius:2,
          data: temas.map(t => porc(ciud, t)) },
        { label:`Con representación (${num(new Set(repr.map(f=>f.idMadre)).size)})`, backgroundColor:'#f59e0b', borderRadius:2,
          data: temas.map(t => porc(repr, t)) }] },
    options:{ indexAxis:'y', scales:{ x:{ ...EJE_Y, title:{ display:true, text:'% de sus menciones' } },
      y:{ ...SIN_EJE, ticks:{ font:{ size:9.5 } } } } }
  });

  const cols = agrupar(filas, 'colonia', 'ipp', 20);
  document.getElementById('tabla-prioridad-colonia').innerHTML = cols.length === 0
    ? '<div class="vacio">Sin problemas priorizados en este filtro.</div>'
    : `<div class="tabla-env"><table class="datos">
      <thead><tr><th class="eje">Colonia o comunidad</th><th class="num">Índice</th>
      <th class="num">Personas</th><th>Problema puesto en primer lugar</th><th>Agenda</th></tr></thead>
      <tbody>${cols.map(c => {
        const p1 = agrupar(c.filas.filter(f => f.orden === 1), 'problema', 'menciones', 1)[0];
        const ag = p1 ? p1.filas[0].agenda : null;
        return `<tr><td class="eje">${esc(c.clave)}</td>
          <td class="num">${num(c.valor)}</td>
          <td class="num">${num(new Set(c.filas.map(f => f.idMadre)).size)}</td>
          <td style="white-space:normal;max-width:420px;">${p1 ? esc(p1.clave) : '<span class="cero">—</span>'}</td>
          <td>${ag ? `<span class="pill ${ag === 'Ambiental' ? 'amb' : 'ter'}">${ag}</span>` : ''}</td></tr>`;

/* ---------- Matriz de cruce ---------- */
function pintarCruce() {
  const dimF = document.getElementById('cr-fila').value;
  const dimC = document.getElementById('cr-col').value;
  const met  = document.getElementById('cr-metrica').value;
  const modo = document.getElementById('cr-modo').value;
  const cont = document.getElementById('cruce-tabla');

  if (dimF === dimC) {
    cont.innerHTML = '<div class="vacio">Elija dos variables distintas para cruzar.</div>';
    if (graficas['g-cruce']) { graficas['g-cruce'].destroy(); delete graficas['g-cruce']; }
    return;
  }
  const filas = filtrado();
  if (!filas.length) { cont.innerHTML = '<div class="vacio">No hay registros con los filtros actuales.</div>'; return; }

  const { clavesCol, matriz, totalesCol, total } = cruzar(filas, dimF, dimC, met, 30, 14);
  const maxCelda = Math.max(1, ...matriz.flatMap(m => m.celdas));

  const valorMostrado = (v, fila, i) => {
    if (modo === 'fila') return fila.total ? (v / fila.total * 100).toFixed(1) + '%' : '—';
    if (modo === 'col')  return totalesCol[i] ? (v / totalesCol[i] * 100).toFixed(1) + '%' : '—';
    return num(v);
  };
  const intensidad = (v, fila, i) => {
    if (v === 0) return 0;
    if (modo === 'fila') return fila.total ? v / fila.total : 0;
    if (modo === 'col')  return totalesCol[i] ? v / totalesCol[i] : 0;
    return v / maxCelda;
  };

  cont.innerHTML = `<div class="tabla-env"><table class="datos">
    <thead><tr>
      <th class="eje">${esc(DIM[dimF].et)}</th>
      ${clavesCol.map(c => `<th class="num" title="${esc(c)}">${esc(cortar(c, 17))}</th>`).join('')}
      <th class="num">Total</th></tr></thead>
    <tbody>${matriz.map(m => `<tr>
      <td class="eje" title="${esc(m.clave)}">${esc(cortar(m.clave, 40))}</td>
      ${m.celdas.map((v, i) => {
        const t = intensidad(v, m, i);
        const bg = v === 0 ? 'transparent' : `rgba(52,211,153,${(0.08 + t * 0.6).toFixed(3)})`;
        return `<td class="num celda ${v === 0 ? 'cero' : ''}" style="background:${bg};cursor:${v ? 'pointer' : 'default'}"
          ${v ? `data-f="${esc(m.clave)}" data-c="${esc(clavesCol[i])}"` : ''}
          title="${esc(m.clave)} × ${esc(clavesCol[i])}: ${num(v)}">
          <span>${valorMostrado(v, m, i)}</span></td>`; }).join('')}
      <td class="num" style="font-weight:600">${num(m.total)}</td></tr>`).join('')}
    </tbody>
    <tfoot><tr><td class="eje" style="background:var(--panel-2)">Total</td>
      ${totalesCol.map(t => `<td class="num">${num(t)}</td>`).join('')}
      <td class="num">${num(total)}</td></tr></tfoot>
  </table></div>`;

  cont.querySelectorAll('td[data-f]').forEach(td => td.onclick = () => {
    filtros[dimF] = new Set([td.dataset.f]);
    filtros[dimC] = new Set([td.dataset.c]);
    refrescar();
    toast(`Filtrado a ${cortar(td.dataset.f, 24)} × ${cortar(td.dataset.c, 24)}`);
  });

  const usarPorcentaje = modo !== 'absoluto';
  pintar('g-cruce', {
    type:'bar',
    data:{ labels: matriz.slice(0, 16).map(m => cortar(m.clave, 24)),
      datasets: clavesCol.map((c, i) => ({
        label: cortar(c, 24), backgroundColor: colorDe(c, i), borderRadius:2,
        data: matriz.slice(0, 16).map(m => usarPorcentaje && m.total
          ? +(m.celdas[i] / m.total * 100).toFixed(1) : m.celdas[i]) })) },
    options:{ scales:{ x:{ ...SIN_EJE, stacked:true, ticks:{ font:{ size:9 }, maxRotation:44 } },
      y:{ ...EJE_Y, stacked:true, title:{ display:usarPorcentaje, text:'% por fila' },
        max: usarPorcentaje ? 100 : undefined } },
      plugins:{ legend:{ labels:{ font:{ size:9.5 } } } } }
  });
}
function exportarCruceCSV() {
  const dimF = document.getElementById('cr-fila').value;

/* ---------- Territorio ---------- */
function pintarTerritorio() {
  const filas = filtrado();

  /* Matriz colonia × tema, en forma de mapa de calor tabular */
  const { clavesCol, matriz } = cruzar(filas, 'colonia', 'bloque', 'menciones', 26, 18);
  const max = Math.max(1, ...matriz.flatMap(m => m.celdas));
  document.getElementById('mapa-calor-tabla').innerHTML = matriz.length === 0
    ? '<div class="vacio">Sin registros.</div>'
    : `<div class="tabla-env" style="max-height:430px;"><table class="datos">
      <thead><tr><th class="eje">Colonia o comunidad</th>
      ${clavesCol.map(c => `<th class="num" title="${esc(c)}" style="font-size:9px;">${esc(cortar(c, 13))}</th>`).join('')}
      <th class="num">Total</th></tr></thead>
      <tbody>${matriz.map(m => `<tr><td class="eje">${esc(cortar(m.clave, 34))}</td>
        ${m.celdas.map(v => `<td class="num celda ${v === 0 ? 'cero' : ''}"
          style="background:${v === 0 ? 'transparent' : colorRampa(v, max)};color:${v > max * .55 ? '#1a1206' : 'inherit'}">
          <span>${v || '·'}</span></td>`).join('')}
        <td class="num" style="font-weight:600">${num(m.total)}</td></tr>`).join('')}
      </tbody></table></div>`;

  /* Cobertura del padrón */
  const conDatos = new Set(estado.problemas.map(f => norm(f.colonia)));
  const colsCubiertas = estado.colonias.filter(c => conDatos.has(norm(c.nombre))).length;
  const locsCubiertas = estado.localidades.filter(l => conDatos.has(norm(l.nombre))).length;
  pintar('g-cobertura', {
    type:'bar',
    data:{ labels:['Colonias','Localidades'], datasets:[
      { label:'Con respuestas', backgroundColor:'#10b981', borderRadius:3,
        data:[colsCubiertas, locsCubiertas] },
      { label:'Sin respuestas', backgroundColor:NEUTRO, borderRadius:3,
        data:[Math.max(0, estado.colonias.length - colsCubiertas),
              Math.max(0, estado.localidades.length - locsCubiertas)] }] },
    options:{ scales:{ x:{ ...SIN_EJE, stacked:true }, y:{ ...EJE_Y, stacked:true } } }
  });
  const vacias = [...estado.colonias, ...estado.localidades]
    .filter(c => !conDatos.has(norm(c.nombre))).map(c => c.nombre).sort((a, b) => a.localeCompare(b, 'es'));
  document.getElementById('lista-vacios').innerHTML = vacias.length === 0
    ? '<p class="nota">Todo el padrón tiene al menos una respuesta.</p>'
    : `<div class="mini-h">${num(vacias.length)} sin una sola respuesta</div>
       <div style="max-height:140px;overflow:auto;font-size:11px;color:var(--texto-medio);line-height:1.7;">
       ${vacias.slice(0, 300).map(v => esc(v)).join(' · ')}</div>
       <p class="nota">Esta lista dirige el levantamiento pendiente. Actívela en el mapa
       con el botón <b>Vacíos</b>.</p>`;

  const alc = agrupar(filas, 'alcance', 'menciones');
  pintar('g-alcance', {
    type:'doughnut',
    data:{ labels: alc.map(a => a.clave),
      datasets:[{ data: alc.map(a => a.valor), borderWidth:0,
        backgroundColor:['#34d399','#a78bfa','#38bdf8','#f59e0b'] }] },
    options:{ cutout:'58%', plugins:{ legend:{ position:'bottom' } } }
  });

  const sel = document.getElementById('ficha-colonia');
  const cols = agrupar(estado.problemas, 'colonia', 'menciones');
  const previo = sel.value;
  sel.innerHTML = cols.map(c => `<option value="${esc(c.clave)}">${esc(c.clave)} (${c.valor})</option>`).join('');
  if (previo && cols.some(c => c.clave === previo)) sel.value = previo;
  pintarFicha();
}

  const filas = estado.problemas.filter(f => f.colonia === nombre);

         ['Ambiental / Territorial', `${num(amb)} / ${num(filas.length - amb)}`],

         ['Edad promedio', edadMedia + (edadMedia !== '—' ? ' años' : '')],
