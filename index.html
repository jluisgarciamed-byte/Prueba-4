        .map(([k, v]) => `<div class="kpi"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}
    </div>
    <div class="rejilla" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));">
      <div>
        <div class="mini-h">Lo que más se señala</div>
        ${top.map((t, i) => `<div class="top-fila"><span class="pos">${i + 1}</span>
          <div class="cuerpo"><span class="et" title="${esc(t.clave)}">${esc(t.clave)}</span>
          <div class="barra-mini" style="width:${t.valor / top[0].valor * 100}%;
            background:${COLOR_AGENDA[t.filas[0].agenda]}"></div></div>
          <span class="n">${t.valor}</span></div>`).join('') || '<div class="vacio">Sin datos.</div>'}
      </div>
      <div>
        <div class="mini-h">Lo que se considera más grave</div>
        ${prio.map((t, i) => `<div class="top-fila"><span class="pos">${i + 1}</span>

          <div class="barra-mini" style="width:${t.valor / prio[0].valor * 100}%"></div></div>

          || '<div class="vacio">Nadie priorizó problemas en esta colonia.</div>'}
        <div class="mini-h">Quién contestó</div>
        ${sexos.map(s => `<div class="dato-fila"><span>${esc(s.clave)}</span><b>${num(s.valor)}</b></div>`).join('')}
      </div>
    </div>`;
}

/* ---------- Levantamiento ---------- */
function pintarLevantamiento() {
  const personas = personasFiltradas();
  const conFecha = personas.filter(p => p._fecha && !isNaN(p._fecha))
    .sort((a, b) => a._fecha - b._fecha);
  if (conFecha.length) {
    const porDia = new Map();
    conFecha.forEach(p => { const d = p._fecha.toISOString().slice(0, 10);
      porDia.set(d, (porDia.get(d) || 0) + 1); });
    const dias = [...porDia.keys()].sort();
    let acum = 0;
    const acumulado = dias.map(d => acum += porDia.get(d));
    pintar('g-avance', {
      data:{ labels: dias, datasets:[
        { type:'bar', label:'Por día', backgroundColor:ACENTO, borderRadius:2,
          data: dias.map(d => porDia.get(d)), yAxisID:'y' },
        { type:'line', label:'Acumulado', borderColor:'#10b981', backgroundColor:'transparent',
          borderWidth:2, pointRadius:0, tension:.25, data: acumulado, yAxisID:'y1' }] },
      options:{ scales:{ x:EJE_X, y:{ ...EJE_Y, position:'left' },
        y1:{ ...EJE_Y, position:'right', grid:{ display:false } } } }
    });
  } else {
    pintar('g-avance', { type:'bar', data:{ labels:['Sin fecha registrada'], datasets:[{ data:[personas.length],
      backgroundColor:NEUTRO }] }, options:{ plugins:{ legend:{ display:false } }, scales:{ x:SIN_EJE, y:EJE_Y } } });
  }

  barrasSimples('g-distribuidor', personas, p => p.distribuidor || 'DIRECTO', '#a78bfa', 'y', 22);

  const filas = filtrado();
  const porDist = agrupar(filas, 'distribuidor', 'menciones', 22);
  pintar('g-rendimiento', {
    type:'bar',
    data:{ labels: porDist.map(d => cortar(d.clave, 22)),
      datasets:[{ data: porDist.map(d => {
        const n = new Set(d.filas.map(f => f.idMadre)).size;
        return n ? +(d.valor / n).toFixed(1) : 0; }), backgroundColor:'#f59e0b', borderRadius:3 }] },
    options:{ indexAxis:'y', plugins:{ legend:{ display:false },
      tooltip:{ callbacks:{ label: c => `${c.raw} problemas por cuestionario` } } },
      scales:{ x:EJE_Y, y:{ ...SIN_EJE, ticks:{ font:{ size:10 } } } } }
  });

  /* Bloques descartados: "ninguno de estos ocurre aquí" */
  const cuenta = new Map();
  personas.forEach(p => (Array.isArray(p.bloques_sin_problemas) ? p.bloques_sin_problemas : [])
    .forEach(b => cuenta.set(b, (cuenta.get(b) || 0) + 1)));
  const pares = [...cuenta.entries()].sort((a, b) => b[1] - a[1]);
  pintar('g-noaplica', {
    type:'bar',
    data:{ labels: pares.map(p => cortar(TITULO_BLOQUE[p[0]] || p[0], 24)),
      datasets:[{ data: pares.map(p => p[1]), borderRadius:3,
        backgroundColor: pares.map(p => COLOR_AGENDA[AGENDA_BLOQUE[p[0]]] || '#94a3b8') }] },
    options:{ plugins:{ legend:{ display:false } },
      scales:{ x:{ ...SIN_EJE, ticks:{ font:{ size:9 }, maxRotation:46 } }, y:EJE_Y } }
  });
}

/* ---------- Calidad de datos ---------- */
function pintarCalidad() {
  const P = estado.participaciones, F = estado.problemas;
  const folios = new Map();
  P.forEach(p => { if (p.folio) folios.set(p.folio, (folios.get(p.folio) || 0) + 1); });
  const duplicados = [...folios.entries()].filter(([, n]) => n > 1);
  const sinGeo = F.filter(f => f.lat == null);
  const fuera = F.filter(f => f.lat != null &&
    (f.lat < BBOX.latMin || f.lat > BBOX.latMax || f.lng < BBOX.lngMin || f.lng > BBOX.lngMax));
  const edadRara = P.filter(p => p.edad != null && (p.edad < 12 || p.edad > 100));
  const sinPrioridad = P.filter(p => Object.keys(p._prioridades || {}).length === 0);
  const degradados = P.filter(p => p._degradado);
  const sinColonia = P.filter(p => !p.colonia_oficial && !p.colonia_comunidad);
  const fueraPadron = F.filter(f => f.asentamiento === 'Sin clasificar');
  const residenciaRara = P.filter(p => p.anios_residencia != null && p.edad != null && p.anios_residencia > p.edad);
  const precisionMala = P.filter(p => p.precision_m != null && p.precision_m > 1500);

  const fila = (et, n, total, malo) => `<div class="dato-fila ${n > 0 ? (malo ? 'mal' : '') : 'bien'}">
    <span>${et}</span><b>${num(n)}${total ? ` · ${pct(n, total)}` : ''}</b></div>`;
  document.getElementById('calidad-lista').innerHTML = `
    ${fila('Cuestionarios en la base', P.length, 0)}
    ${fila('Problemas georreferenciados', F.length - sinGeo.length, F.length)}
    ${fila('Problemas sin ubicación', sinGeo.length, F.length, true)}
    ${fila('Puntos fuera del área de cobertura', fuera.length, F.length, true)}
    ${fila('Folios repetidos', duplicados.length, 0, true)}
    ${fila('Cuestionarios sin priorizar', sinPrioridad.length, P.length, true)}
    ${fila('Registros guardados en modo degradado', degradados.length, P.length, true)}
    ${fila('Sin colonia declarada', sinColonia.length, P.length, true)}
    ${fila('Colonia fuera del padrón', new Set(fueraPadron.map(f => f.colonia)).size, 0, true)}
    ${fila('Edad fuera de 12 a 100 años', edadRara.length, P.length, true)}
    ${fila('Más años de residencia que de edad', residenciaRara.length, P.length, true)}
    ${fila('Ubicación con error mayor a 1.5 km', precisionMala.length, P.length, true)}
    <p class="nota">${degradados.length > 0
      ? 'Los registros degradados guardaron la priorización dentro de <code>otros</code> porque la tabla aún no tenía las columnas. El tablero ya los lee, pero conviene correr la migración SQL para normalizarlos.'
      : 'Sin registros degradados: la migración SQL está aplicada y la priorización viaja en sus columnas.'}</p>`;

  const conP = P.filter(p => p.precision_m != null);
  const cubos = [['Menor a 30 m', p => p.precision_m < 30], ['30 a 150 m', p => p.precision_m >= 30 && p.precision_m < 150],
    ['150 a 500 m', p => p.precision_m >= 150 && p.precision_m < 500],
    ['500 m a 1.5 km', p => p.precision_m >= 500 && p.precision_m < 1500],
    ['Más de 1.5 km', p => p.precision_m >= 1500]];
  pintar('g-precision', {
    type:'bar',
    data:{ labels:[...cubos.map(c => c[0]), 'Marcado a mano'],
      datasets:[{ data:[...cubos.map(c => conP.filter(c[1]).length), P.length - conP.length],
        backgroundColor:['#10b981','#4ade80','#facc15','#fb923c','#ef4444','#38bdf8'], borderRadius:3 }] },
    options:{ plugins:{ legend:{ display:false } },
      scales:{ x:{ ...SIN_EJE, ticks:{ font:{ size:9.5 }, maxRotation:38 } }, y:EJE_Y } }
  });

  const revisar = [];
  duplicados.forEach(([f, n]) => revisar.push(['Folio repetido', f, `${n} cuestionarios con el mismo folio`]));
  edadRara.forEach(p => revisar.push(['Edad atípica', p.folio || `id ${p.id}`, `${p.edad} años`]));
  residenciaRara.forEach(p => revisar.push(['Residencia mayor a la edad', p.folio || `id ${p.id}`,
    `${p.anios_residencia} años de residencia con ${p.edad} de edad`]));
  fuera.slice(0, 60).forEach(f => revisar.push(['Fuera de cobertura', f.folio || `id ${f.idMadre}`,
    `${f.lat.toFixed(4)}, ${f.lng.toFixed(4)} · ${f.codigo}`]));
  [...new Set(fueraPadron.map(f => f.colonia))].forEach(c =>
    revisar.push(['Colonia fuera del padrón', c, 'No coincide con Colonias_SFR ni con Localidades']));
  precisionMala.slice(0, 40).forEach(p => revisar.push(['Ubicación imprecisa', p.folio || `id ${p.id}`,
    `±${Math.round(p.precision_m)} m`]));

  document.getElementById('calidad-tabla').innerHTML = revisar.length === 0
    ? '<div class="vacio">Ningún registro requiere revisión.</div>'
    : `<div class="tabla-env" style="max-height:400px;"><table class="datos">
      <thead><tr><th>Situación</th><th>Folio o clave</th><th>Detalle</th></tr></thead>
      <tbody>${revisar.slice(0, 400).map(r => `<tr><td>${esc(r[0])}</td>
        <td class="cod">${esc(r[1])}</td><td style="white-space:normal;">${esc(r[2])}</td></tr>`).join('')}
      </tbody></table></div>
      ${revisar.length > 400 ? `<p class="nota">Se muestran 400 de ${num(revisar.length)}. Descargue el respaldo JSON para revisarlos todos.</p>` : ''}`;
}

/* ============================================================================
   EXPORTACIONES — todo se genera en el navegador
   ============================================================================ */
function bajar(contenido, nombre, tipo) {
  const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 900);
  toast('Descarga iniciada: ' + nombre);
}
function sello_() { return new Date().toISOString().slice(0, 10); }
function celdaCSV(v) {
  let s = v == null ? '' : String(v);
  if (/^[=+\-@]/.test(s)) s = "'" + s;          // neutraliza fórmulas en Excel
  return /[",;\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function bajarCSV(filas, nombre) {
  const texto = '\uFEFF' + filas.map(f => f.map(celdaCSV).join(',')).join('\r\n');
  bajar(texto, `${nombre}_${sello_()}.csv`, 'text/csv;charset=utf-8');
}

const CAMPOS_CSV = [
  ['folio','Folio'], ['codigo','Código'], ['agenda','Agenda'], ['tituloBloque','Tema'],
  ['texto','Problema'], ['textoLibre','Texto escrito'], ['orden','Lugar de gravedad'],
  ['peso','Puntos de prioridad'], ['colonia','Colonia o comunidad'], ['asentamiento','Tipo de asentamiento'],
  ['sexo','Sexo'], ['edad','Edad'], ['lgbtiq','LGBTIQ+'], ['lgbtiq_cual','Identidad'],
  ['nacimiento','Lugar de nacimiento'], ['residencia','Años de residencia'],
  ['escolaridad','Escolaridad'], ['ocupacion','Ocupación'], ['trabajo','Lugar de trabajo'],
  ['adscripcion','Autoadscripción'], ['representacion','Carácter'], ['distribuidor','Aplicador'],
  ['alcance','Alcance'], ['lat','Latitud'], ['lng','Longitud'], ['precision_m','Precisión (m)']
];

function datosExportar() {
  const solo = document.getElementById('exp-filtrado');
  return (!solo || solo.checked) ? filtrado() : estado.problemas;
}
function propiedades(f) {
  const o = {};
  CAMPOS_CSV.forEach(([k, et]) => { o[et] = f[k] ?? ''; });
  o['Fecha'] = f.fecha ? f.fecha.toISOString() : '';
  return o;
}
function coleccion(filas) {
  return { type:'FeatureCollection',
    crs:{ type:'name', properties:{ name:'urn:ogc:def:crs:OGC:1.3:CRS84' } },
    features: filas.filter(f => f.geom || f.lat != null).map(f => ({
      type:'Feature',
      geometry: f.geom || { type:'Point', coordinates:[f.lng, f.lat] },
      properties: propiedades(f) })) };
}

async function exportar(que) {
  const filas = datosExportar();
  if (!filas.length) { toast('No hay registros que exportar con el filtro actual'); return; }

  if (que === 'geojson') {
    bajar(JSON.stringify(coleccion(filas), null, 1),
      `problemas_pmduoet_${sello_()}.geojson`, 'application/geo+json');

  } else if (que === 'csv') {
    bajarCSV([[...CAMPOS_CSV.map(c => c[1]), 'Fecha', 'WKT'],
      ...filas.map(f => [...CAMPOS_CSV.map(c => f[c[0]] ?? ''),
        f.fecha ? f.fecha.toISOString() : '',
        aWKT(f.geom) || (f.lat != null ? `POINT(${f.lng} ${f.lat})` : '')])],
      'problemas_pmduoet');

  } else if (que === 'csv-personas') {
    const ids = new Set(filas.map(f => f.idMadre));
    const P = estado.participaciones.filter(p => ids.has(p.id));
    const cols = ['folio','distribuidor','sexo','lgbtiq','lgbtiq_cual','edad','lugar_nacimiento',
      'anios_residencia','escolaridad','ocupacion','ocupacion_otro','lugar_trabajo','lugar_trabajo_otro',
      'autoadscripcion','representacion','representacion_otro','colonia_comunidad','colonia_oficial',
      'total_ambiental','total_territorial','lat','lng','precision_m'];
    bajarCSV([[...cols, 'tipo_asentamiento', 'problemas_senalados', 'indice_prioridad', 'fecha'],
      ...P.map(p => {
        const suyas = filas.filter(f => f.idMadre === p.id);
        return [...cols.map(c => p[c] ?? ''), p._asentamiento, suyas.length,
          suyas.reduce((a, f) => a + f.peso, 0), p._fecha ? p._fecha.toISOString() : ''];
      })], 'cuestionarios_pmduoet');

  } else if (que === 'kml') {
    bajar(construirKML(filas), `problemas_pmduoet_${sello_()}.kml`,
      'application/vnd.google-earth.kml+xml');

  } else if (que === 'colonias') {
    const agr = agregadoPorColonia(filas);
    const feats = estado.colonias.filter(c => c.geometry).map(c => {
      const a = agr.get(norm(c.nombre));
      const fs = a ? a.filas : [];
      const top = fs.length ? agrupar(fs, 'problema', 'menciones', 1)[0] : null;
      const p1 = fs.filter(f => f.orden === 1);
      const top1 = p1.length ? agrupar(p1, 'problema', 'menciones', 1)[0] : null;
      return { type:'Feature', geometry:c.geometry, properties:{
        colonia: c.nombre,
        menciones: fs.length,
        personas: new Set(fs.map(f => f.idMadre)).size,
        ambiental: fs.filter(f => f.agenda === 'Ambiental').length,
        territorial: fs.filter(f => f.agenda === 'Territorial').length,
        indice_prioridad: fs.reduce((a, f) => a + f.peso, 0),
        problema_top: top ? top.clave : '',
        codigo_top: top ? top.filas[0].codigo : '',
        problema_mas_grave: top1 ? top1.clave : '',
        tema_top: fs.length ? agrupar(fs, 'bloque', 'menciones', 1)[0].clave : '' } };
    });
    bajar(JSON.stringify({ type:'FeatureCollection',
      crs:{ type:'name', properties:{ name:'urn:ogc:def:crs:OGC:1.3:CRS84' } }, features: feats }, null, 1),
      `colonias_agregado_${sello_()}.geojson`, 'application/geo+json');

  } else if (que === 'agenda') {
    const g = agrupar(filas, 'problema', 'menciones');
    bajarCSV([['Código','Agenda','Tema','Problema','Menciones','Personas','Índice de prioridad',
        'Veces en primer lugar','Colonias donde se localiza','Listado de colonias'],
      ...g.map(x => {
        const cols = [...new Set(x.filas.map(f => f.colonia))];
        return [x.filas[0].codigo, x.filas[0].agenda, x.filas[0].tituloBloque, x.clave, x.valor,
          new Set(x.filas.map(f => f.idMadre)).size, x.filas.reduce((a, f) => a + f.peso, 0),
          x.filas.filter(f => f.orden === 1).length, cols.length, cols.join(' | ')];
      })], 'agenda_priorizada_pmduoet');

  } else if (que === 'json') {
    bajar(JSON.stringify({
      generado: new Date().toISOString(),
      fuente:'participacion_pmduoet + problemas_pmduoet',
      filtros_aplicados: Object.fromEntries(Object.entries(filtros).map(([k, v]) => [k, [...v]])),
      cuestionarios: estado.participaciones.length,
      problemas: filas.map(propiedades)
    }, null, 1), `respaldo_participacion_${sello_()}.json`, 'application/json');

  } else if (que === 'shp') {
    await exportarShapefile(filas);
  }
}

function construirKML(filas) {
  const coords = g => {
    const p = c => `${c[0]},${c[1]},0`;
    if (g.type === 'Point') return `<Point><coordinates>${p(g.coordinates)}</coordinates></Point>`;
    if (g.type === 'LineString') return `<LineString><coordinates>${g.coordinates.map(p).join(' ')}</coordinates></LineString>`;
    if (g.type === 'Polygon') return `<Polygon><outerBoundaryIs><LinearRing><coordinates>${
      g.coordinates[0].map(p).join(' ')}</coordinates></LinearRing></outerBoundaryIs></Polygon>`;
    if (g.type.startsWith('Multi')) return `<MultiGeometry>${g.coordinates.map(c =>
      coords({ type:g.type.replace('Multi',''), coordinates:c })).join('')}</MultiGeometry>`;
    return '';
  };
  const x = s => String(s ?? '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' })[c]);
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>Participación ciudadana PMDUOET 2050 — San Francisco del Rincón</name>
<Style id="amb"><IconStyle><color>ff81b910</color></IconStyle><LineStyle><color>ff81b910</color><width>2</width></LineStyle><PolyStyle><color>6681b910</color></PolyStyle></Style>
<Style id="ter"><IconStyle><color>ff0b9ef5</color></IconStyle><LineStyle><color>ff0b9ef5</color><width>2</width></LineStyle><PolyStyle><color>660b9ef5</color></PolyStyle></Style>
${filas.filter(f => f.geom || f.lat != null).map(f => {
  const g = f.geom || { type:'Point', coordinates:[f.lng, f.lat] };
  const props = Object.entries(propiedades(f)).filter(([, v]) => v !== '' && v != null);
  return `<Placemark><name>${x(cortar(f.texto, 60))}</name>
<styleUrl>#${f.agenda === 'Ambiental' ? 'amb' : 'ter'}</styleUrl>
<ExtendedData>${props.map(([k, v]) => `<Data name="${x(k)}"><value>${x(v)}</value></Data>`).join('')}</ExtendedData>
${coords(g)}</Placemark>`;
}).join('\n')}
</Document></kml>`;
}

async function exportarShapefile(filas) {
  if (!window.shpwrite) {
    toast('Preparando la librería de shapefile…');
    const ok = await cargarScript('https://cdn.jsdelivr.net/npm/@mapbox/shp-write@0.4.3/shpwrite.js')
      .catch(() => false);
    if (!ok || !window.shpwrite) {
      toast('No se pudo cargar la librería. Descargue el GeoJSON: QGIS lo convierte a shapefile.', 5000);
      return;
    }
  }
  /* Un shapefile no mezcla geometrías: se separan en tres capas dentro del ZIP,
     y los nombres de campo se recortan a 10 caracteres como exige el formato DBF. */
  const corto = {};
  CAMPOS_CSV.forEach(([, et]) => { corto[et] = et.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9]/g,'_').slice(0, 10); });
  const recortar = f => { const o = {}; Object.entries(propiedades(f)).forEach(([k, v]) => {
    o[corto[k] || k.slice(0, 10)] = typeof v === 'object' ? String(v) : v; }); return o; };
  const grupos = { puntos:[], lineas:[], areas:[] };
  filas.forEach(f => {
    const g = f.geom || (f.lat != null ? { type:'Point', coordinates:[f.lng, f.lat] } : null);
    if (!g) return;
    const feat = { type:'Feature', geometry:g, properties: recortar(f) };
    const t = g.type.toLowerCase();
    if (t.includes('polygon')) grupos.areas.push(feat);
    else if (t.includes('linestring')) grupos.lineas.push(feat);
    else grupos.puntos.push(feat);
  });
  for (const [nombre, feats] of Object.entries(grupos)) {
    if (!feats.length) continue;
    try {
      shpwrite.download({ type:'FeatureCollection', features:feats },
        { folder:`pmduoet_${nombre}`, types:{ point:`pmduoet_${nombre}`, polyline:`pmduoet_${nombre}`,
          polygon:`pmduoet_${nombre}` } });
    } catch (e) { console.error(e); }
  }
  toast('Shapefiles generados en EPSG:4326. Reproyecte a EPSG:32614 en QGIS.', 4600);
}
function cargarScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = () => res(true); s.onerror = rej;
    document.head.appendChild(s);
  });
}

/* ============================================================================
   CONSULTA POR FOLIO
   El folio que el geoportal entrega al terminar es la única llave que tiene la
   persona: no guarda nombre ni correo. Sirve para tres cosas —recuperar un
   cuestionario cuando alguien pregunta qué reportó, verificar en gabinete una
   captura dudosa y atender una solicitud de baja conforme al aviso de
   privacidad—, así que la búsqueda vive en el encabezado y no dentro de un panel.
   ============================================================================ */
let folioAbierto = null;

function buscarFolio() {
  const q = norm(document.getElementById('buscar-folio').value).replace(/\s/g, '');
  const caja = document.getElementById('folio-resultados');
  if (q.length < 2) { caja.classList.remove('visible'); caja.innerHTML = ''; return; }

  const hallazgos = estado.participaciones.filter(p => {
    if (p.folio && norm(p.folio).replace(/\s/g, '').includes(q)) return true;
    return String(p.id) === q;                       // también acepta el id interno
  }).slice(0, 40);

  caja.innerHTML = hallazgos.length === 0
    ? `<div style="padding:10px 11px;color:var(--texto-tenue);font-size:11.5px;line-height:1.5;">
       Ningún cuestionario con ese folio.<br>Verifique que esté completo: el geoportal lo
       entrega en la pantalla de agradecimiento.</div>`
    : hallazgos.map(p => {
        const n = estado.problemas.filter(f => f.idMadre === p.id).length;
        return `<button class="folio-res" data-id="${p.id}">
          <b>${esc(p.folio || 'id ' + p.id)}</b>
          <span>${esc(p.colonia_oficial || p.colonia_comunidad || 'Sin colonia')} ·
          ${n} problema${n === 1 ? '' : 's'} ·
          ${p._fecha && !isNaN(p._fecha) ? p._fecha.toLocaleDateString('es-MX',
            { day:'2-digit', month:'short', year:'numeric' }) : 'sin fecha'}</span></button>`;
      }).join('');
  caja.classList.add('visible');
  caja.querySelectorAll('.folio-res').forEach(b => b.onclick = () => abrirFolio(Number(b.dataset.id)));
}

function abrirFolio(id) {
  const p = estado.participaciones.find(x => x.id === id);
  if (!p) { toast('No se encontró ese cuestionario'); return; }
  folioAbierto = p;
  document.getElementById('folio-resultados').classList.remove('visible');
  document.getElementById('modal-titulo').textContent = p.folio || `Cuestionario ${p.id}`;
  document.getElementById('modal-sub').innerHTML =
    `${esc(p.colonia_oficial || p.colonia_comunidad || 'Sin colonia declarada')} ·
     ${esc(p._asentamiento)} ·
     ${p._fecha && !isNaN(p._fecha) ? esc(p._fecha.toLocaleString('es-MX',
       { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' })) : 'sin fecha registrada'}
     · aplicado por ${esc(p.distribuidor || 'DIRECTO')}`;
  document.getElementById('modal-cuerpo').innerHTML = htmlCuestionario(p);
  document.getElementById('modal-folio').classList.add('visible');
  document.getElementById('modal-cerrar').focus();
}
function cerrarFolio() {
  document.getElementById('modal-folio').classList.remove('visible');
  folioAbierto = null;
}

function htmlCuestionario(p) {
  const mios = estado.problemas.filter(f => f.idMadre === p.id);
  const dato = (k, v) => v == null || v === '' ? '' :
    `<div class="perfil-dato"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`;

  const lista = agenda => {
    const fs = mios.filter(f => f.agenda === agenda)
      .sort((a, b) => (a.orden || 99) - (b.orden || 99) || a.codigo.localeCompare(b.codigo));
    if (!fs.length) return `<p class="nota" style="border:none;padding:0;margin:4px 0 0;">
      No señaló ningún problema de esta agenda.</p>`;
    const cls = agenda === 'Ambiental' ? 'amb' : 'ter';
    return fs.map(f => `<div class="prob-fila ${cls} ${f.orden ? 'grave' : ''}">
      <span class="prob-orden">${f.orden ? f.orden + '.º' : '·'}</span>
      <div>${esc(f.texto)}${f.textoLibre ? ` <i style="color:var(--texto-medio)">— "${esc(f.textoLibre)}"</i>` : ''}
        <span class="cod">${esc(f.codigo)} · ${esc(f.tituloBloque)} ·
        ${({punto:'punto',linea:'línea',poligono:'polígono'})[f.alcance] || f.alcance}
        ${f.lat != null ? ` · ${f.lat.toFixed(5)}, ${f.lng.toFixed(5)}` : ' · sin ubicación'}</span>
      </div></div>`).join('');
  };

  const descartados = (Array.isArray(p.bloques_sin_problemas) ? p.bloques_sin_problemas : [])
    .map(b => TITULO_BLOQUE[b] || b);
  const amb = mios.filter(f => f.agenda === 'Ambiental').length;

  return `
    <div class="perfil-rejilla">
      ${dato('Sexo', p.sexo)}
      ${dato('Edad', p.edad != null ? p.edad + ' años' : null)}
      ${dato('Escolaridad', p.escolaridad)}
      ${dato('Ocupación', p.ocupacion === 'Otro' && p.ocupacion_otro ? 'Otro: ' + p.ocupacion_otro : p.ocupacion)}
      ${dato('Lugar de trabajo', p.lugar_trabajo === 'Otro' && p.lugar_trabajo_otro ? p.lugar_trabajo_otro : p.lugar_trabajo)}
      ${dato('Nació en', p.lugar_nacimiento)}
      ${dato('Años de residencia', p.anios_residencia != null ? p.anios_residencia : null)}
      ${dato('Autoadscripción', p.autoadscripcion)}
      ${dato('Población LGBTIQ+', p.lgbtiq === 'Sí' && p.lgbtiq_cual ? 'Sí · ' + p.lgbtiq_cual : p.lgbtiq)}
      ${dato('Carácter', p.representacion === 'Otro' && p.representacion_otro ? 'Otro: ' + p.representacion_otro : p.representacion)}
      ${dato('Ubicación de referencia', p.lat != null ? `${Number(p.lat).toFixed(5)}, ${Number(p.lng).toFixed(5)}` : 'No marcada')}
      ${dato('Precisión del GPS', p.precision_m != null ? `±${Math.round(p.precision_m)} m` : 'Marcada a mano')}
    </div>

    <div class="mini-h" style="margin-top:0;">Agenda ambiental · ${amb} problema${amb === 1 ? '' : 's'}</div>
    ${lista('Ambiental')}
    <div class="mini-h">Agenda territorial · ${mios.length - amb} problema${mios.length - amb === 1 ? '' : 's'}</div>
    ${lista('Territorial')}

    ${descartados.length ? `<div class="mini-h">Temas revisados y descartados</div>
      <p style="font-size:11.5px;color:var(--texto-medio);line-height:1.6;margin:0;">
      ${descartados.map(d => esc(d)).join(' · ')}</p>` : ''}

    <p class="nota">El número al inicio de cada renglón es el lugar de gravedad que le dio
    la persona; el punto significa que lo señaló sin ponerlo entre los tres más graves.
    Índice de prioridad de este cuestionario:
    <b style="font-family:var(--mono)">${mios.reduce((a, f) => a + f.peso, 0)}</b>.</p>`;
}

function montarConsultaFolio() {
  const inp = document.getElementById('buscar-folio');
  let t;
  inp.oninput = () => { clearTimeout(t); t = setTimeout(buscarFolio, 180); };
  inp.onkeydown = e => {
    if (e.key === 'Enter') {
      const primero = document.querySelector('.folio-res');
      if (primero) primero.click();
    }
    if (e.key === 'Escape') { document.getElementById('folio-resultados').classList.remove('visible'); inp.blur(); }
  };
  inp.onfocus = () => { if (inp.value.length >= 2) buscarFolio(); };
  document.addEventListener('click', e => {
    if (!e.target.closest('.folio-caja')) document.getElementById('folio-resultados').classList.remove('visible');
  });

  document.getElementById('modal-cerrar').onclick = cerrarFolio;
  document.getElementById('modal-folio').onclick = e => {
    if (e.target.id === 'modal-folio') cerrarFolio();
  };
  document.getElementById('modal-filtrar').onclick = () => {
    if (!folioAbierto) return;
    rangos.folio = folioAbierto.folio || null;
    rangos.folioId = folioAbierto.id;
    cerrarFolio(); refrescar();
    toast('Tablero filtrado a un solo cuestionario. Quite el chip para volver.');
  };
  document.getElementById('modal-mapa').onclick = () => {
    if (!folioAbierto) return;
    const fs = estado.problemas.filter(f => f.idMadre === folioAbierto.id && f.lat != null);
    if (!fs.length) { toast('Este cuestionario no tiene ubicaciones registradas'); return; }
    cerrarFolio();
    const b = L.latLngBounds(fs.map(f => [f.lat, f.lng]));
    if (b.isValid()) mapa.fitBounds(b.pad(.45));
  };
  document.getElementById('modal-csv').onclick = () => {
    if (!folioAbierto) return;
    const p = folioAbierto;
    const mios = estado.problemas.filter(f => f.idMadre === p.id);
    bajarCSV([[...CAMPOS_CSV.map(c => c[1]), 'WKT'],
      ...mios.map(f => [...CAMPOS_CSV.map(c => f[c[0]] ?? ''),
        aWKT(f.geom) || (f.lat != null ? `POINT(${f.lng} ${f.lat})` : '')])],
      `folio_${(p.folio || p.id).toString().replace(/[^\w-]/g, '')}`);
  };
}

/* ============================================================================
   CICLO PRINCIPAL
   ============================================================================ */
function refrescar() {
  invalidar();
  pintarKPIs();
  pintarChips();
  pintarFiltros();
  pintarRielDerecho();
  pintarMapa();
  refrescarPanel(panelActivo());
  if (document.getElementById('exp-filtrado')) pintarExportar();
}

async function iniciar() {
  montarLogos();
  try {
    await cargarTodo();
  } catch (e) {
    console.error(e);
    cargando(false);
    document.getElementById('paneles').innerHTML =
      `<div class="aviso"><b>No se pudieron leer los datos.</b><br>${esc(e.message)}<br><br>
       Revise que las políticas RLS de <code>participacion_pmduoet</code> y
       <code>problemas_pmduoet</code> permitan SELECT con la llave anónima, y que haya
       conexión a internet.</div>`;
    return;
  }
  cargando('Preparando el tablero…');
  iniciarMapa();
  armarPaneles();
  montarConsultaFolio();
  document.getElementById('der-metrica').onchange = () => { pintarRielDerecho();
    if (modoMapa === 'coropleta') pintarMapa(); };
  document.getElementById('btn-limpiar').onclick = limpiarFiltros;
  document.getElementById('btn-recargar').onclick = async () => {
    cargando('Volviendo a leer la base…');
    try { await cargarTodo(); refrescar(); toast('Datos actualizados'); }
    catch (e) { toast('No se pudo actualizar: ' + e.message, 4200); }
    cargando(false);
  };
  document.getElementById('btn-exportar').onclick = () => {
    document.querySelector('.tab[data-panel="exportar"]').click();
  };
  document.getElementById('btn-filtros-movil').onclick = () =>
    document.getElementById('riel-izq').classList.toggle('abierto');
  document.getElementById('btn-tops-movil').onclick = () =>
    document.getElementById('riel-der').classList.toggle('abierto');
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { apagarLazo(); cerrarFolio();
      document.querySelectorAll('.riel').forEach(r => r.classList.remove('abierto')); }
  });
  window.addEventListener('resize', () => { if (mapa) setTimeout(() => mapa.invalidateSize(), 160); });

  refrescar();
  setTimeout(encuadrar, 400);
  cargando(false);

  if (estado.problemas.length === 0) {
    document.getElementById('paneles').insertAdjacentHTML('afterbegin',
      `<div class="aviso">La base respondió, pero no hay problemas registrados todavía.
       El tablero quedará vacío hasta que lleguen las primeras respuestas del geoportal.</div>`);
  }
}

iniciar();

</script>
